<title>Adam 的 HOME</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* Standalone app (GitHub Pages): sign in with Google, store data in Firestore (fb.js), installable with offline cache.
   Inside claude.ai none of this runs and the page uses Claude's own storage. */
if (/\.github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
  window.HOME_READY = new Promise(r => { window.HOME_RESOLVE = r; });
  const add = (tag, attrs) => { const e = document.createElement(tag); Object.assign(e, attrs); document.head.appendChild(e); };
  add("link", { rel: "manifest", href: "manifest.webmanifest" });
  add("link", { rel: "apple-touch-icon", href: "icons/180.png" });
  add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
  add("meta", { name: "mobile-web-app-capable", content: "yes" });
  add("meta", { name: "apple-mobile-web-app-title", content: "HOME" });
  add("meta", { name: "theme-color", content: "#1d2124" });
  add("script", { type: "module", src: "fb.js" });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a slim left rail (expands on hover/tap) holds every switch; the desk to its right = overview, urgency board, week columns, done calendar */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --fg:#1d2124; --muted:#6d747a; --line:#e3e4e1;
  --accent:#2f5d8a; --accent-soft:#e6eef6;
  --hot:#c2412d; --hot-soft:#fbe9e5; --warn:#b07a12; --warn-soft:#f8efd9; --calm:#7a8288; --calm-soft:#eef0f1;
  --good:#2f7d4f; --good-soft:#e3f1e8; --rail:#eeeeeb;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail-w:60px; --rail-open:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191b; --surface:#1f2225; --fg:#e7e9ea; --muted:#9aa1a7; --line:#30353a;
  --accent:#7fb0e0; --accent-soft:#22313f;
  --hot:#ef8a76; --hot-soft:#3a2420; --warn:#e2b45a; --warn-soft:#352b18; --calm:#a3abb1; --calm-soft:#272b2f; --good:#6cc391; --good-soft:#1d3226; --rail:#1b1e20;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191b; --surface:#1f2225; --fg:#e7e9ea; --muted:#9aa1a7; --line:#30353a;
  --accent:#7fb0e0; --accent-soft:#22313f;
  --hot:#ef8a76; --hot-soft:#3a2420; --warn:#e2b45a; --warn-soft:#352b18; --calm:#a3abb1; --calm-soft:#272b2f; --good:#6cc391; --good-soft:#1d3226; --rail:#1b1e20;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1340px;margin:0 auto;padding-block:20px 60px;padding-left:calc(var(--rail-w) + max(20px,env(safe-area-inset-left,0px)));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:.02em;font-weight:700}
.sub{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- left rail ---- */
.side{position:fixed;left:0;top:0;bottom:0;z-index:20;width:calc(var(--rail-w) + env(safe-area-inset-left,0px));background:var(--rail);border-right:1px solid var(--line);
  padding-left:env(safe-area-inset-left,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transition:width .18s ease, box-shadow .18s ease;overflow:hidden}
.side-scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:14px 10px 20px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.side.open{width:calc(var(--rail-open) + env(safe-area-inset-left,0px));box-shadow:4px 0 24px rgba(0,0,0,.12)}
@media (hover:hover){.side:hover{width:calc(var(--rail-open) + env(safe-area-inset-left,0px));box-shadow:4px 0 24px rgba(0,0,0,.12)}}
.side .lbl{white-space:nowrap;opacity:0;transition:opacity .12s}
.side.open .lbl{opacity:1}
@media (hover:hover){.side:hover .lbl{opacity:1}}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 14px;font-weight:700;letter-spacing:.04em}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;flex:none}
.grp{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px;white-space:nowrap;height:32px}
.navb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:8px;padding:8px 9px;cursor:pointer;color:var(--muted);text-align:left;font-size:14px;min-height:38px}
.navb svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navb:hover{background:var(--calm-soft);color:var(--fg)}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.navb .val{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.navb.sec{font-size:13px;min-height:32px;padding:5px 9px}
.navb.sec svg{width:16px;height:16px;margin:0 2px}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 6px}
.menu-btn{display:none}
@media (max-width:700px){
  :root{--rail-w:0px}
  .side{width:0;border-right:0}
  .side.open{width:min(82vw, calc(var(--rail-open) + env(safe-area-inset-left,0px)));border-right:1px solid var(--line)}
  .menu-btn{display:grid;place-items:center;position:fixed;z-index:21;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
  .menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .wrap{padding-top:64px}
  .brand{padding-left:52px}
}
.scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.25)}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
section.block{margin-bottom:34px;scroll-margin-top:calc(16px + env(safe-area-inset-top,0px))}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.sec-h .sp{flex:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
/* urgency board */
.board{display:grid;grid-template-columns:repeat(var(--ncol,3),minmax(0,1fr));gap:16px}
@media (min-width:861px){.board[style*="--ncol:4"],.board[style*="--ncol:5"],.board[style*="--ncol:6"]{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.col.custom .dot{background:var(--muted)}
.ctx.cm{position:fixed;z-index:60;min-width:200px;max-width:280px}
#cmenu[hidden],#slash[hidden]{display:none}
.ctx.slash{position:fixed;z-index:70;min-width:220px;max-width:300px;max-height:320px;overflow:auto}
.ctx.slash button{display:flex;align-items:center;gap:8px;width:100%}
.ctx.slash button.on{background:var(--accent-soft)}
.sl-ic{display:inline-flex;justify-content:center;width:22px;height:22px;align-items:center;border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--muted);flex:0 0 auto}
.sl-chip{flex:0 0 auto;border:0;border-radius:6px;padding:2px 8px;font-size:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer;white-space:nowrap}
.item.blk .t,.item.blk hr{flex:1}
.item.k-h .t{font-weight:700;font-size:15.5px}
.item.k-p .t{color:var(--fg)}
.item.blk .bul{flex:0 0 auto;width:18px;color:var(--muted);font-family:var(--f-mono);font-size:13px;text-align:center}
.item.k-ul .bul{font-size:18px;line-height:1;color:var(--fg)}
.item.k-tg{display:block}
.item.k-tg details>summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none}
.item.k-tg details>summary::-webkit-details-marker{display:none}
.item.k-tg .tw{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px;width:18px;text-align:center}
.item.k-tg details[open] .tw{transform:rotate(90deg)}
.item.k-tg summary .t{flex:1}
.tg-kids{list-style:none;margin:4px 0 2px 24px;padding:0}
.tg-kids li{display:flex;gap:6px;align-items:center;padding:2px 0}.tg-kids li::before{content:"•";width:18px;text-align:center;font-size:16px;line-height:1}.tg-kids li .t{flex:1}
.tg-kids li .icon-btn{opacity:0}.tg-kids li:hover .icon-btn{opacity:1}
.tg-add{margin-left:26px}
.item.k-tb{display:block}
.item.k-tb .tb-h{display:flex;align-items:center;gap:6px;min-height:4px}.item.k-tb .tb-h .t{flex:1}
.tb-wrap{overflow-x:auto;margin:4px 0}
.utb{border-collapse:collapse;font-size:13.5px;min-width:100%}
.utb th,.utb td{border:1px solid var(--line);padding:0;min-width:84px}
.utb th{background:var(--calm-soft);font-weight:600}
.utb .tb-x{border:0;min-width:0;width:24px}.utb .tb-x .icon-btn{opacity:0}.utb tr:hover .tb-x .icon-btn{opacity:1}
.tb-cell{width:100%;border:0;background:transparent;padding:5px 7px;font:inherit;color:var(--fg);font-size:16px}
@media (hover:hover) and (pointer:fine){.tb-cell{font-size:13.5px}}
.utb th .tb-cell{font-weight:600}
.tb-cell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.tb-tools{display:flex;gap:6px;opacity:.55}.item.k-tb:hover .tb-tools,.item.k-tb:focus-within .tb-tools{opacity:1}
.item.k-hr hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.ctx.cm .add{display:flex;gap:6px;align-items:center}
.ctx.cm .add input[type=text]{flex:1;min-width:0}
.ctx-sep{height:1px;background:var(--line);margin:6px 0}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;min-width:0}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.col-h b{font-size:15px}
.col-h .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.urgent .dot{background:var(--hot)} .nagging .dot{background:var(--warn)} .later .dot{background:var(--calm)}
ul.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:8px;padding:4px 2px;border-radius:6px;min-width:0}
.item:hover{background:var(--bg)}
.item[draggable="true"]{cursor:grab}
.item input[type=checkbox]{width:16px;height:16px;margin-top:4px;accent-color:var(--accent);flex:none;cursor:pointer}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through}
.item .due{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--calm-soft);color:var(--muted);white-space:nowrap;margin-top:2px}
.item .due.soon{background:var(--hot-soft);color:var(--hot)}
.item .acts{display:none;gap:2px}
.item:hover .acts,.item:focus-within .acts{display:flex}
@media (hover:none){.item .acts{display:flex}}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 5px;border-radius:5px;font-size:13px;line-height:1.4}
.icon-btn:hover{background:var(--calm-soft);color:var(--fg)}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:5px 2px;font-size:14px}
.add input:focus{outline:none;border-bottom-color:var(--accent)}
.add input[type=date]{flex:0 0 auto;width:auto;font-size:12px;color:var(--muted)}
.done-toggle{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px 2px 0}
/* week */
/* five wide day columns; the row scrolls sideways instead of squeezing them */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(360px,1fr);gap:16px;align-items:start;overflow-x:auto;padding-bottom:12px;overscroll-behavior-x:contain;scrollbar-width:auto;scrollbar-color:var(--muted) var(--calm-soft)}
.week::-webkit-scrollbar{height:10px}
.week::-webkit-scrollbar-track{background:var(--calm-soft);border-radius:5px}
.week::-webkit-scrollbar-thumb{background:var(--muted);border-radius:5px}
@media (max-width:640px){.week{grid-auto-columns:86vw}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day-h{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.day-h b{font-family:var(--f-mono);font-size:15px;font-weight:500}
.day-h span{color:var(--muted);font-size:13px}
.day-h .badge{margin-left:auto;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:9px}
details.proj{margin-top:6px}
details.proj summary{cursor:pointer;font-weight:500;font-size:14px;padding:3px 2px;list-style:none;display:flex;align-items:center;gap:6px}
details.proj summary::-webkit-details-marker{display:none}
details.proj summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .12s;display:inline-block}
details.proj[open] summary::before{transform:rotate(90deg)}
details.proj summary .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
details.proj summary .icon-btn{margin-left:auto}
details.proj .inner{padding-left:16px}
details.proj.virtual summary{color:var(--muted);font-weight:400}
.day-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.day-foot select{border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12.5px;padding:3px 6px;color:var(--muted)}
.mini{font-size:12.5px}
.progress{height:4px;border-radius:2px;background:var(--calm-soft);overflow:hidden;margin:2px 0 6px}
.progress i{display:block;height:100%;background:var(--good)}
.carry-tag{font-family:var(--f-mono);font-size:10.5px;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;margin-top:3px;white-space:nowrap}
.settings-panel{margin-bottom:16px}
.settings-panel .prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.settings-panel .prow span{flex:1;min-width:0}
.settings-panel label.pin{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center}
/* overview strip */
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:26px}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.ov .k{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .v{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.3}
.ov .v small{font-size:13px;color:var(--muted)}
.ov .progress{margin:6px 0 0}
.ov.alert .v{color:var(--hot)}
.ov.ok .v{color:var(--good)}
/* done calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 7px;min-height:104px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:hover{border-color:var(--muted)}
.cell.out{opacity:.4}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell.sel{background:var(--accent-soft)}
.cell.has{background:linear-gradient(var(--good-soft),var(--good-soft)) top/100% 3px no-repeat, var(--surface)}
.cell.has.sel{background:var(--accent-soft)}
.cell .n{font-family:var(--f-mono);font-size:13px;display:flex;justify-content:space-between;gap:4px}
.cell .n em{font-style:normal;color:var(--good);font-size:11px;font-weight:500}
.cell .ln{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.cell .ln::before{content:"✓ ";color:var(--good)}
.cell .more{font-size:11.5px;color:var(--muted)}
@media (max-width:700px){.cell{min-height:56px;padding:4px 5px}.cell .ln,.cell .more{display:none}}
.cal-detail{margin-top:12px}
.cal-detail .src{font-size:11.5px;color:var(--muted);background:var(--calm-soft);border-radius:5px;padding:0 6px;white-space:nowrap;margin-top:3px}
/* review */
.review-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:960px){.review-grid{grid-template-columns:1fr}}
.inline-edit{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;background:var(--surface);cursor:text;white-space:normal}
.focus-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.top3 .sec-h,.inbox .sec-h{margin-bottom:6px}
.top-list{list-style:none;margin:0;padding:0;counter-reset:top}
.top-list .item{counter-increment:top}
.top-list .item::before{content:counter(top);font-family:var(--f-mono);font-weight:600;color:var(--accent);width:16px;text-align:center}
.top-list .src,.ib-list .src{font-size:12px;color:var(--muted);white-space:nowrap}
.top-done{margin:8px 0 0;color:var(--good)}
.icon-btn.pin.on{color:var(--warn);opacity:1}
.ib-list .ib-acts{display:flex;gap:4px;align-items:center;opacity:.35}.ib-list .item:hover .ib-acts,.ib-list .item:focus-within .ib-acts{opacity:1}
@media (hover:none){.ib-list .ib-acts{opacity:1}}
#qc{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.18);display:flex;justify-content:center;align-items:flex-start;padding:18vh 16px 0}
#qc[hidden]{display:none}
.qc-box{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 16px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px}
.qc-box b{font-size:13px;color:var(--muted);font-weight:500}
.qc-box input{font-size:17px;border:0;border-bottom:1px solid var(--line);padding:8px 2px;background:transparent;color:var(--fg);outline:none}
.dlg-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.2)}
.dlg{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.dlg h3{margin:0 0 4px;font-size:17px}.dlg .fl{display:flex;flex-direction:column;gap:4px;margin:12px 0;font-size:13px;color:var(--muted)}
.dlg textarea,.dlg input[type=date]{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.sp-prev{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.sp-prev small{color:var(--muted)}.sp-prev div{display:flex;gap:10px}.sp-prev b{font-family:var(--f-mono);font-weight:500;min-width:6.5em}

function save(path, body, delay=500){ pending.set(path, body); clearTimeout(timers.get(path)); timers.set(path, setTimeout(()=>flush(path), delay)); }
async function flush(path){
  if (inflight.has(path)) { timers.set(path, setTimeout(()=>flush(path), 300)); return; }
  const body = pending.get(path); if (!body || !db) return;
  inflight.add(path);
  try {
    await db.doc(path).set(body);
    if (pending.get(path) === body) { pending.delete(path); setCache(path, body); }
    const el=document.getElementById("savedNote"); if (el) el.textContent = T("saved_at", new Date().toTimeString().slice(0,5));
  } catch(e) {
    if (e && e.code==="quota_exceeded") toast(T("quota"));
    else if (e && e.code==="unavailable") setTimeout(()=>flush(path), 1500+Math.random()*1000);
    else toast(T("save_fail", e && e.message || e));
  } finally { inflight.delete(path); }
}
function setCache(path, body){ const [c,id]=path.split("/"); if (c==="tasks") S.tasks[id]=body; else if (c==="days") S.days[id]=body; else if (c==="expenses") S.expenses[id]=body; else if (c==="events") S.events[id]=body; else if (c==="gymlog") S.gymlog[id]=body; else if (path==="gym/plan") S.gymPlan=body; else if (path==="settings/main") S.settings=body; else if (c==="inbox") S.inbox[id]=body; }
async function remove(path){
  pending.delete(path); clearTimeout(timers.get(path));
  const [c,id]=path.split("/"); if (c==="tasks") delete S.tasks[id]; if (c==="events") delete S.events[id]; if (c==="inbox") delete S.inbox[id];
  if (db) { try { await db.doc(path).delete(); } catch(e){ toast(T("del_fail")); } }
}

const DAY_MAX=7;
function dayDefault(){ const t=today(); return [-1,0,1,2,3].map(i=>addDays(t,i)); }
/* the day cards: what was saved, plus one more card at the end for every day that has passed since, keeping at most 7 */
function dayCards(){ const st=settings().dayCards; if(!st || !st.list || !st.list.length) return dayDefault();
  let list=[...new Set(st.list)].sort(); const passed=Math.max(0,Math.round((parse(today())-parse(st.at||today()))/864e5));
  for (let i=0;i<Math.min(passed,DAY_MAX);i++) list.push(addDays(list[list.length-1],1));
  return list.slice(-DAY_MAX); }
function saveDayCards(list){ const st=clone(settings()); list=[...new Set(list)].sort(); if(list.length>DAY_MAX) list=list.slice(-DAY_MAX);
  st.dayCards = list.length?{list, at:today()}:null; save("settings/main",st,50); render(); }

/* unfinished items from the past 14 days, shown under today automatically */
function carried(){
  const t=today(), out=[];
  for (let i=14;i>=1;i--){ const ds=addDays(t,-i); if(!hasDay(ds)) continue; const d=day(ds);
    (d.items||[]).forEach(it=>{ if(!it.d && !it.k) out.push({date:ds, pi:-1, it, proj:null}); });
    (d.projects||[]).forEach((p,pi)=>p.items.forEach(it=>{ if(!it.d && !it.k) out.push({date:ds, pi, it, proj:p.name}); })); }
  return out;
}

}

function startInlineEdit(el, ref){
  const old=el.textContent, dl=el.closest("[draggable=true]"); if (dl) dl.draggable=false; el.contentEditable="plaintext-only"; el.classList.add("inline-edit"); el.focus();

    el.removeEventListener("keydown",kd); el.removeEventListener("blur",bl);

const GC="Google Calendar", GC_CALS=[{id:null, kind:"own"}, {id:"zh-tw.taiwan#holiday@group.v.calendar.google.com", kind:"holiday"}];

async function gcMcp(){ if (G.mcp===undefined){ try{ G.mcp = await window.claude?.use?.("mcp") || null; }catch(e){ G.mcp=null; } } return G.mcp; }
function gcEvDates(ev){ const s=ev.start||{}, e=ev.end||{};
  if (s.date){ const out=[]; let d=s.date; const end=e.date||addDays(s.date,1); for(let i=0;i<62 && d<end;i++){ out.push(d); d=addDays(d,1); } return out; }
  if (s.dateTime) return [ymd(new Date(s.dateTime))]; return []; }
function gcByDate(){ const by={};
  for (const [k,list] of Object.entries(G.data)) for (const ev of list){ if(ev.status==="cancelled") continue;
    const tm = ev.start?.dateTime ? new Date(ev.start.dateTime).toTimeString().slice(0,5) : "";
    for (const d of gcEvDates(ev)) (by[d]=by[d]||[]).push({t:ev.summary||T("gc_untitled"), tm, link:ev.htmlLink, kind:k.startsWith("holiday")?"holiday":"own"}); }
  for (const k in by) by[k].sort((a,b)=>(a.kind==="holiday"?-1:0)-(b.kind==="holiday"?-1:0) || a.tm.localeCompare(b.tm));
  return by; }
function gcErrKind(e){ const c=e&&e.code; return ["needs_reauth","server_not_connected","selection_required","server_not_found"].includes(c)?"conn" : c==="approval_required"||c==="not_in_manifest"||c==="consent_required"?"perm" : ["not_granted","capability_disabled","capability_removed"].includes(c)?"off" : "fail"; }
async function gcWatch(from, to){
  const key=from+"|"+to; if (G.range===key) return; G.range=key;
  const m=await gcMcp(); if (!m || G.range!==key) return;
  G.unsub.forEach(u=>{ try{u();}catch(_){} }); G.unsub=[]; G.data={};
  GC_CALS.forEach(c=>{ const input={startTime:from+"T00:00:00", endTime:to+"T00:00:00", pageSize:250, orderBy:"startTime"}; if(c.id) input.calendarId=c.id;
    const k=c.kind+":"+(c.id||"primary");
    G.unsub.push(m.watchTool(GC,"list_events",input, ev=>{
      if (ev.type==="data"){ G.data[k]=(ev.result.payload&&ev.result.payload.events)||[]; G.err=null; }
      else { const kd=gcErrKind(ev.error); if (kd!=="fail") delete G.data[k]; if (c.kind==="own" || kd!=="fail") G.err=kd; }
      softRender(); }, {refetchInterval:300000, cache:{staleTime:60000, gcTime:3600000}})); });
}
async function gcAllow(){ const m=await gcMcp(); if(!m) return; G.busy=true; render();

const WPS = [{"file": "bg/16.jpg", "name": "海峽電塔", "hue": 208, "sat": 34, "pos": 45}, {"file": "bg/17.jpg", "name": "海邊屋頂", "hue": 205, "sat": 28, "pos": 40}, {"file": "bg/18.jpg", "name": "紅燈塔", "hue": 210, "sat": 34, "pos": 50}, {"file": "bg/11.jpg", "name": "楓湖", "hue": 14, "sat": 40, "pos": 74}].map(w=>({...w, thumb:w.file.replace("bg/","bg/t/")}));

function wpList(){ return [...WPS.map(w=>({...w, src:w.file})), ...((settings().customWps)||[]).map(w=>({...w, src:w.url, file:w.url, custom:true}))]; }
function wpFor(tab){ const key=((settings().wp)||{})[tab] || WP_DEFAULT[tab] || WPS[0].file; return wpList().find(w=>w.file===key) || {...WPS[0], src:WPS[0].file}; }
const tintEl=document.createElement("style"); document.body.appendChild(tintEl);
function applyTint(h,s){
  const sl=Math.max(10,Math.min(30,s*0.75)), sa=Math.max(30,Math.min(55,s+12)), q=sl*0.6;
  const Lt=`--bg:hsl(${h} ${sl}% 97%);--surface:hsl(${h} ${q}% 99.4%);--line:hsl(${h} ${q}% 87.5%);--rail:hsl(${h} ${sl}% 94%);--accent:hsl(${h} ${sa}% 33%);--accent-soft:hsl(${h} ${sa}% 92%);--calm-soft:hsl(${h} ${q}% 92.5%);--muted:hsl(${h} 9% 41%);--fg:hsl(${h} 18% 13%);`;
  const Dk=`--bg:hsl(${h} 14% 9.5%);--surface:hsl(${h} 13% 12.5%);--line:hsl(${h} 11% 21%);--rail:hsl(${h} 14% 10.5%);--accent:hsl(${h} ${sa}% 72%);--accent-soft:hsl(${h} 28% 19%);--calm-soft:hsl(${h} 10% 16%);--muted:hsl(${h} 9% 64%);--fg:hsl(${h} 12% 91%);`;
  tintEl.textContent=`:root{${Lt}}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){${Dk}}}:root[data-theme="dark"]{${Dk}}`;
}

        <label class="wp-item wp-up"><input type="file" accept="image/*" id="wpFile" hidden><span>${S.wpBusy?T("wp_uploading"):"＋ "+T("wp_upload")}</span></label>

function wpPos(w){ const o=((settings().wpPos)||{})[w.file]; return o || [50, w.pos??50]; }
function setWp(file){ const st=clone(settings()); st.wp={...(st.wp||{}), [S.tab]:file}; save("settings/main",st,50); render(); }
function hueOf(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=60; c.height=24; const x=c.getContext("2d"); x.drawImage(im,0,0,60,24); const d=x.getImageData(0,0,60,24).data; let sx=0,sy=0,ws=0,ss=0;
  for(let i=0;i<d.length;i+=4){ const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), s=mx?(mx-mn)/mx:0; let h=0; if(mx!==mn){ h= mx===r?((g-b)/(mx-mn))%6 : mx===g?(b-r)/(mx-mn)+2 : (r-g)/(mx-mn)+4; h*=60; } const w=s*mx+0.001; sx+=Math.cos(h*Math.PI/180)*w; sy+=Math.sin(h*Math.PI/180)*w; ss+=s*w; ws+=w; }
  res({hue:Math.round((Math.atan2(sy,sx)*180/Math.PI+360)%360), sat:Math.round(ss/ws*100)}); }catch(e){ res({hue:210,sat:20}); } }; im.onerror=()=>res({hue:210,sat:20}); im.src=src; }); }
async function uploadWp(file){
  let assets=null; try{ assets=await window.claude?.use?.("assets"); }catch(e){}
  if (!assets){ toast(T("wp_no_upload")); return; }
  S.wpBusy=true; render();
  try { const a=await assets.upload(file); const c=await hueOf(a.url);
    const st=clone(settings()); st.customWps=[...(st.customWps||[]), {id:a.id, url:a.url, name:file.name.replace(/\.[^.]+$/,"").slice(0,20), hue:c.hue, sat:c.sat}];
    st.wp={...(st.wp||{}), [S.tab]:a.url}; save("settings/main",st,50);
  } catch(e){ toast(T("wp_upload_fail")); }
  S.wpBusy=false; render();
}

  const x = d.ox>1 ? cl(d.p[0]-(e.clientX-d.x)/d.ox*100) : d.p[0], y = d.oy>1 ? cl(d.p[1]-(e.clientY-d.y)/d.oy*100) : d.p[1];
  S.wpAdj.pos=[x,y]; d.img.style.objectPosition=`${x}% ${y}%`; });
document.addEventListener("pointerup", ()=>{ wpDrag=null; });
document.addEventListener("pointercancel", ()=>{ wpDrag=null; });
/* ---------- "/" command menu in add fields, like Notion ---------- */
const slEl=document.createElement("div"); slEl.id="slash"; slEl.className="ctx slash"; slEl.hidden=true; slEl.setAttribute("role","listbox"); document.body.appendChild(slEl);
const SL={inp:null, list:[], i:0, at:-1};
function slashMode(f){ let m; try{ m=JSON.parse(f.dataset.mode||"{}"); }catch(_){ m={}; }
  // Notion-style shortcuts at the start of the text: "- " "1. " "> " "[] "
  const inp=f.querySelector("input[type=text]"); if (inp && !m.k){ const v=inp.value, r=[[/^[-*•]\s+/,"ul"],[/^\d+[.)]\s+/,"ol"],[/^>\s+/,"tg"],[/^\[\s?\]\s+/,null]].find(([re])=>re.test(v)); if (r){ inp.value=v.replace(r[0],""); if (r[1]) m.k=r[1]; } }
  return m; }
function clearSlash(f){ delete f.dataset.mode; f.querySelector(".sl-chip")?.remove(); }
function setSlash(f, mode, label){ f.dataset.mode=JSON.stringify(mode); let c=f.querySelector(".sl-chip"); if(!c){ c=document.createElement("button"); c.type="button"; c.className="sl-chip"; c.title=T("sl_clear"); c.addEventListener("click",()=>{ clearSlash(f); f.querySelector("input")?.focus(); }); f.prepend(c); } c.textContent=label+" ✕"; }
function slashCmds(f){
  const cmds=[], add=(icon,label,kw,run)=>cmds.push({icon,label,kw:(label+" "+kw).toLowerCase(),run});
  add("☐",T("sl_todo"),"todo checkbox 待辦 dd",(f)=>clearSlash(f));
  add("•",T("sl_bullet"),"bulleted list bullet 項目符號 xmfh",(f)=>setSlash(f,{k:"ul"},"• "+T("sl_bullet")));
  add("1.",T("sl_numbered"),"numbered list number 編號 bh",(f)=>setSlash(f,{k:"ol"},"1. "+T("sl_numbered")));
  add("▸",T("sl_toggle"),"toggle list 折疊 zd",(f)=>setSlash(f,{k:"tg"},"▸ "+T("sl_toggle")));
  add("▦",T("sl_table"),"table grid 表格 bg",(f)=>{ setSlash(f,{k:"tb"},"▦ "+T("sl_table")); const i=f.querySelector("input[type=text]"); if (i && !i.value.trim()) f.requestSubmit(); });
  return cmds; }
function slashClose(){ SL.inp=null; slEl.hidden=true; slEl.innerHTML=""; }
function slashRender(){
  if (!SL.list.length){ slEl.innerHTML=`<p class="empty mini">${T("sl_none")}</p>`; }
  else slEl.innerHTML=`<div class="ctx-h">${T("sl_title")}</div>`+SL.list.map((c,i)=>`<button type="button" role="option" class="${i===SL.i?"on":""}" data-sl="${i}" aria-selected="${i===SL.i}"><span class="sl-ic">${esc(c.icon)}</span>${esc(c.label)}</button>`).join("");
  slEl.hidden=false; const r=SL.inp.getBoundingClientRect(), h=slEl.offsetHeight, w=slEl.offsetWidth;
  slEl.style.left=Math.max(8,Math.min(r.left, innerWidth-w-8))+"px"; slEl.style.top=(r.bottom+h+8>innerHeight ? Math.max(8,r.top-h-4) : r.bottom+4)+"px";
  slEl.querySelector("button.on")?.scrollIntoView({block:"nearest"}); }
function slashCheck(inp){
  const f=inp.form; if (!f || !["it-add","task-add"].includes(f.dataset.act) || inp.type!=="text") { if (SL.inp) slashClose(); return; }
  const v=inp.value.slice(0, inp.selectionStart ?? inp.value.length), m=v.match(/(^|\s)[\/／]([^\s\/／]*)$/);
  if (!m){ if (SL.inp) slashClose(); return; }
  const q=m[2].toLowerCase(), all=slashCmds(f);
  SL.inp=inp; SL.at=v.length-m[2].length-1; SL.list=all.filter(c=>!q || c.kw.includes(q)); SL.i=Math.min(SL.i, Math.max(0,SL.list.length-1)); if (SL.list.length===0 && q.length>12) return slashClose();
  slashRender(); }
function slashPick(i){ const c=SL.list[i], inp=SL.inp; if(!c||!inp) return; const f=inp.form, end=inp.selectionStart ?? inp.value.length;
  inp.value=(inp.value.slice(0,SL.at)+inp.value.slice(end)).replace(/\s+$/,m=>m); slashClose(); c.run(f,inp); if (document.body.contains(inp)) inp.focus(); }
document.addEventListener("input", e=>{ const t=e.target; if (t.tagName==="INPUT"){ if (!e.isComposing) { if (!SL.inp) SL.i=0; slashCheck(t); } } });
document.addEventListener("compositionend", e=>{ if (e.target.tagName==="INPUT") slashCheck(e.target); });
document.addEventListener("keydown", e=>{ if (!SL.inp || e.target!==SL.inp || e.isComposing) return;
  if (e.key==="ArrowDown"){ e.preventDefault(); SL.i=(SL.i+1)%Math.max(1,SL.list.length); slashRender(); }
  else if (e.key==="ArrowUp"){ e.preventDefault(); SL.i=(SL.i-1+SL.list.length)%Math.max(1,SL.list.length); slashRender(); }
  else if ((e.key==="Enter"||e.key==="Tab") && SL.list.length){ e.preventDefault(); e.stopImmediatePropagation(); slashPick(SL.i); }
  else if (e.key==="Escape"){ e.preventDefault(); slashClose(); } }, true);
slEl.addEventListener("pointerdown", e=>{ e.preventDefault(); const b=e.target.closest("[data-sl]"); if (b) slashPick(+b.dataset.sl); });
document.addEventListener("focusout", e=>{ if (SL.inp && e.target===SL.inp) setTimeout(()=>{ if (document.activeElement!==SL.inp) slashClose(); },0); });
/* right-click menu for the cards on HOME: delete a card, or add one in that row */
const cmEl=document.createElement("div"); cmEl.id="cmenu"; cmEl.className="ctx cm"; cmEl.hidden=true; cmEl.setAttribute("role","menu"); document.body.appendChild(cmEl);
function renderCm(){ const c=S.cm; if(!c){ cmEl.hidden=true; cmEl.innerHTML=""; return; }
  const btn=(act,label,data="")=>`<button role="menuitem" data-act="${act}" ${data}>${label}</button>`;
  let h="";
  if (c.row==="ov"){ if (c.id) h+=btn("cm-ov-del",`✕ ${T("cm_del_card")}`,`data-id="${esc(c.id)}"`);
    const shown=new Set(ovCards()), miss=ovAll().filter(x=>!shown.has(x));
    h+=`<div class="ctx-h">${T("cm_add_card")}</div>` + (miss.length?miss.map(x=>btn("cm-ov-add","＋ "+esc(ovLabel(x)),`data-id="${esc(x)}"`)).join(""):`<p class="empty mini">${T("cm_all_shown")}</p>`);
    if (settings().ovCards) h+=btn("cm-ov-reset",T("cm_reset")); }
  else if (c.row==="col"){
    if (c.task){ const tk=task(c.task); if (tk) h+=btn("cm-edit",`✎ ${T("cm_edit_item", esc(tk.title))}`,`data-task="${tk.id}"`); }
    if (c.task){ const tk=task(c.task); if (tk) h+=btn("task-del",`✕ ${T("cm_del_item", esc(tk.title))}`,`data-id="${tk.id}"`); }
    if (c.id) h+=`<div class="ctx-h">${T("cm_add_item")}</div><form class="add" data-act="task-add" data-bucket="${esc(c.id)}"><input type="text" id="cm-task" placeholder="${T("add_enter")}" autocomplete="off"><input type="date" id="cm-task-due" title="${T("due_title")}"></form><div class="ctx-sep"></div>`;
    if (c.id){ const b=bucketList().find(x=>x.id===c.id); h+=btn("cm-col-del",`✕ ${T("cm_del_col", b?bName(b):"")}`,`data-id="${esc(c.id)}"`); }
    h+=`<div class="ctx-h">${T("cm_add_col")}</div><form class="add" data-act="cm-col-add"><input type="text" id="cm-col-name" placeholder="${T("cm_col_ph")}" autocomplete="off"></form>`; }
  else if (c.row==="day"){ const list=dayCards(), nx=addDays(list[list.length-1],1);
    if (c.id){ const it=c.item, sec=c.sec;
      if (it && c.title) h+=btn("cm-edit",`✎ ${T("cm_edit_item", esc(c.title))}`,`data-date="${it.date}" data-pi="${it.pi}" data-id="${it.id}"`);
      if (it) h+=btn("it-del",`✕ ${T("cm_del_item", esc(c.title))}`,`data-date="${it.date}" data-pi="${it.pi}" data-id="${it.id}"`);
      if (sec && !it) h+= sec.pi!=null ? btn("proj-del",`✕ ${T("cm_del_sec", esc(sec.name))}`,`data-date="${c.id}" data-pi="${sec.pi}"`)
                                       : (pinned().includes(sec.name)?btn("cm-unpin",`✕ ${T("cm_unpin", esc(sec.name))}`,`data-name="${esc(sec.name)}"`):"");
      h+=`<div class="ctx-h">${sec?T("cm_add_item_to", esc(sec.name)):T("cm_add_item")}</div><form class="add" data-act="it-add" data-date="${c.id}" ${sec?`data-proj="${esc(sec.name)}"`:""}><input type="text" id="cm-it" placeholder="${T("todo_ph")}" autocomplete="off"></form>`;
      const d=day(c.id), have=new Set((d.projects||[]).map(p=>p.name)); if (c.id>=today()) pinned().forEach(n=>have.add(n));
      const opts=settings().projects.filter(p=>!have.has(p));
      if (opts.length) h+=`<div class="ctx-h">${T("cm_add_sec")}</div>`+opts.map(p=>btn("cm-sec-add","＋ "+esc(p),`data-date="${c.id}" data-name="${esc(p)}"`)).join("");
      h+=`<div class="ctx-sep"></div>`; }
    if (c.id) h+=btn("cm-day-del",`✕ ${T("cm_del_day", md(c.id))}`,`data-date="${c.id}"`)+(c.id===list[0]?`<p class="empty mini">${T("cm_day_first", md(nx))}</p>`:"");
    h+=`<div class="ctx-h">${T("cm_add_day")}</div>`+btn("cm-day-add",`＋ ${md(nx)} ${dow(nx)}`,`data-date="${nx}"`)+`<form class="add" data-act="cm-day-pick"><input type="date" id="cm-day-date" aria-label="${T("cm_pick_day")}"><button class="ghost mini" type="submit">${T("cm_add")}</button></form>`
      + (list.length>=DAY_MAX?`<p class="empty mini">${T("cm_day_max")}</p>`:""); }
  else if (c.row==="txt"){
    if (c.tk) h+=btn("tx-hide", T("tx_del", esc(c.title)), `data-key="${esc(c.tk)}"`);
    else if (c.note) h+=btn("tx-note-del", T("tx_del", esc(c.title)), `data-id="${esc(c.note)}"`);
    else { h+=btn("tx-add", T("tx_add"));
      const hid=Object.keys(settings().hideTk||{}); if (hid.length) h+=`<div class="ctx-h">${T("tx_restore")}</div>`+hid.map(k=>btn("tx-unhide","↺ "+esc(T(k)),`data-key="${esc(k)}"`)).join(""); } }
  cmEl.innerHTML=h; cmEl.hidden=false;
  const w=cmEl.offsetWidth, hh=cmEl.offsetHeight; cmEl.style.left=Math.max(8,Math.min(c.x, innerWidth-w-8))+"px"; cmEl.style.top=Math.max(8,Math.min(c.y, innerHeight-hh-8))+"px";
}
/* free text boxes: settings.notes [{id, tab, at, text}], placed after the page block "at" */
function blockKey(v, el){ const kids=[...v.children]; const i=kids.indexOf(el); return el.id ? "#"+el.id : "i"+i; }
function injectNotes(v){
  const ns=(settings().notes||[]).filter(n=>n.tab===S.tab); if (!ns.length) return;
  const kids=[...v.children];
  ns.forEach(n=>{ const p=document.createElement("p"); p.className="unote"; p.dataset.note=n.id; p.textContent=n.text||"";
    if (S.edit){ p.contentEditable="plaintext-only"; p.spellcheck=false; p.dataset.ph=T("tx_ph"); }
    let at=null; if (n.at && n.at[0]==="#") at=kids.find(k=>k.id===n.at.slice(1)); else if (n.at) at=kids[+n.at.slice(1)];
    // keep notes after earlier notes placed at the same block
    if (at){ let ref=at; while (ref.nextSibling && ref.nextSibling.classList && ref.nextSibling.classList.contains("unote")) ref=ref.nextSibling; ref.after(p); }
    else if (n.at==="top") v.prepend(p); else v.appendChild(p); });
}
document.addEventListener("focusout", e=>{ const el=e.target; if (!el.classList || !el.classList.contains("unote") || !el.isContentEditable) return;
  const id=el.dataset.note, v=el.innerText.replace(/\n+$/,""); const st=clone(settings()); const n=(st.notes||[]).find(x=>x.id===id); if (!n) return;
  if (!v.trim()){ st.notes=st.notes.filter(x=>x.id!==id); save("settings/main",st,50); setTimeout(()=>{ if(!isTyping()) render(); },0); return; }
  if (n.text===v) return; n.text=v; save("settings/main",st,50); toast(T("edit_saved")); }, true);
/* edit mode: right-click a text box to delete it, empty space to add one */
document.addEventListener("contextmenu", e=>{
  const t=e.target; if (!S.edit || !t.closest || t.closest("#cmenu")) return;
  const v=document.getElementById("view"), hero=t.closest("#heroTitle,.hero,header");
  const tk=t.closest("[data-tk]"), note=t.closest(".unote");
  let c=null;
  if (tk && !(settings().hideTk||{})[tk.dataset.tk]) c={tk:tk.dataset.tk, title:(tk.textContent||"").slice(0,24)};
  else if (note) c={note:note.dataset.note, title:(note.textContent||T("tx_note")).slice(0,24)};
  else if (v.contains(t) && !t.closest("input,textarea,select,button,a,li,img,summary,.cell,.chip,[data-drag],[contenteditable],table")){
    let el=t; while (el && el.parentElement!==v) el=el.parentElement;
    c={at: el ? blockKey(v, el.classList.contains("unote")?(el.previousElementSibling||el):el) : "end"}; }
  else if (hero && !t.closest("input,button,a")) c={at:"top"};
  else if (t===document.body || t===document.documentElement || t===v.parentElement) c={at:"end"};
  if (!c) return; e.preventDefault(); e.stopPropagation(); S.ctx=null; S.cm={row:"txt", x:e.clientX, y:e.clientY, sy:scrollY, ...c}; renderCm(); }, true);
document.addEventListener("contextmenu", e=>{
  const t=e.target; if (!t.closest || S.tab!=="home" || S.edit) return;
  if (t.closest("#s-cal") || t.closest("#cmenu") || t.closest("input,textarea,select,[contenteditable]")) return;
  let row=null, id=null;
  const ov=t.closest(".ov[data-card]"), col=t.closest(".col[data-bucket]"), dy=t.closest(".day[data-day]");
  let extra={};
  if (ov){ row="ov"; id=ov.dataset.card; } else if (t.closest("#s-overview")) row="ov";
  else if (col){ row="col"; id=col.dataset.bucket; const li=t.closest("li[data-task]"); if (li) extra={task:li.dataset.task}; } else if (t.closest("#s-tasks")) row="col";
  else if (dy){ row="day"; id=dy.dataset.day;
    const li=t.closest("li.item"), del=li&&li.querySelector('[data-act="it-del"]'), sec=t.closest("details.proj");
    if (del) extra={item:{...del.dataset}, title:li.querySelector(".t")?.textContent||""};
    if (sec){ const nm=sec.querySelector("summary")?.dataset.name; extra.sec={name:nm, pi:sec.dataset.pi??null}; } }
  else if (t.closest("#s-week")) row="day";
  if (!row) return; e.preventDefault(); S.cm={row,id,x:e.clientX,y:e.clientY,sy:scrollY,...extra}; renderCm(); });
cmEl.addEventListener("click", e=>{ const b=e.target.closest("button[data-act]"); if (b && !b.closest("form")) setTimeout(()=>{ S.cm=null; renderCm(); },0); });
cmEl.addEventListener("submit", ()=>setTimeout(()=>{ S.cm=null; renderCm(); },0));
document.addEventListener("pointerdown", e=>{ if (S.cm && !e.target.closest("#cmenu")){ S.cm=null; renderCm(); } });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && S.cm){ S.cm=null; renderCm(); } });
addEventListener("scroll", ()=>{ if (S.cm && Math.abs(scrollY-(S.cm.sy??scrollY))>60){ S.cm=null; renderCm(); } }, {passive:true});
/* drag routine chips to reorder */
let rtDrag=null;
const rtSide=(c,e)=>{ const b=c.getBoundingClientRect(); return e.clientX<b.left+b.width/2?"l":"r"; };
const rtClear=()=>document.querySelectorAll(".chip.ins-l,.chip.ins-r,.chip.dragging").forEach(x=>x.classList.remove("ins-l","ins-r","dragging"));
document.addEventListener("dragstart", e=>{ const c=e.target.closest&&e.target.closest("[data-rt]"); if(!c) return; rtDrag=c.dataset.rt; c.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",rtDrag);}catch(_){} });
document.addEventListener("dragover", e=>{ const c=rtDrag && e.target.closest && e.target.closest("[data-rt]"); if(!c) return; e.preventDefault(); document.querySelectorAll(".chip.ins-l,.chip.ins-r").forEach(x=>x.classList.remove("ins-l","ins-r")); if(c.dataset.rt!==rtDrag) c.classList.add("ins-"+rtSide(c,e)); });
document.addEventListener("drop", e=>{ const c=rtDrag && e.target.closest && e.target.closest("[data-rt]"); if(!c) return; e.preventDefault();
  const from=rtDrag, to=c.dataset.rt, side=rtSide(c,e); rtDrag=null; rtClear(); if(from===to) return;
  const pl=clone(gymPlan()), rs=pl.routines, i=rs.findIndex(r=>r.id===from); if(i<0) return; const [m]=rs.splice(i,1);
  let j=rs.findIndex(r=>r.id===to); if(j<0) return; if(side==="r") j++; rs.splice(j,0,m); savePlan(pl); render(); });
document.addEventListener("dragend", ()=>{ rtDrag=null; rtClear(); });
document.addEventListener("dragstart", e=>{ const li=e.target.closest&&e.target.closest("[data-task]"); if(!li) return; dragId=li.dataset.task; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId);}catch(_){} });
document.addEventListener("dragover", e=>{ const c=e.target.closest&&e.target.closest(".col"); if(!c||!dragId) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x=>x!==c&&x.classList.remove("drop")); c.classList.add("drop"); });
document.addEventListener("dragleave", e=>{ const c=e.target.closest&&e.target.closest(".col"); if(c && !c.contains(e.relatedTarget)) c.classList.remove("drop"); });
document.addEventListener("drop", e=>{ const c=e.target.closest&&e.target.closest(".col"); if(!c||!dragId) return; e.preventDefault(); const t=task(dragId); if(t && t.bucket!==c.dataset.bucket) save("tasks/"+t.id,{...t,bucket:c.dataset.bucket},50); dragId=null; render(); });
document.addEventListener("dragend", ()=>{ dragId=null; document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop")); });

/* ---------- boot ---------- */
render();
function banner(msg){ const b=document.getElementById("banner"); b.textContent=msg; b.hidden=!msg; }
(async () => {
  if (window.HOME_READY){ await window.HOME_READY; render(); }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db=null; }
  if (!db){ banner(T("offline")); return; }
  for (const p of pending.keys()) flush(p);
  const waiting=new Set(["tasks","days","expenses","settings","events","gymlog","gym","inbox"]);
  const timer=setTimeout(()=>{ if (waiting.size) banner(T("loading")); }, 10000);
  const done=(k,snap)=>{ if (!snap.metadata.fromCache){ waiting.delete(k); if (!waiting.size){ clearTimeout(timer); banner(""); } } };
  const fail=k=>e=>{ waiting.delete(k); if (e.code!=="revoked") banner(T("disconnected",e.code)); };
  const sub=(name)=>db.collection(name).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S[name]=o; done(name,snap); softRender(); }, fail(name));
  sub("tasks"); sub("days"); sub("expenses"); sub("events"); sub("gymlog"); sub("inbox");
  db.doc("gym/plan").onSnapshot(s=>{ S.gymPlan=s.exists?s.data():null; done("gym",s); softRender(); }, fail("gym"));
  db.doc("settings/main").onSnapshot(s=>{ S.settings=s.exists?s.data():null; done("settings",s); softRender(); }, fail("settings"));
})();
})();
</script>
