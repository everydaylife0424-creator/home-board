<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adam 的 HOME</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>
/* Standalone app (GitHub Pages): sign in with Google, store data in Firestore (fb.js), installable with offline cache.
   Inside claude.ai none of this runs and the page uses Claude's own storage. */
if (/\.github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
  window.HOME_READY = new Promise(r => { window.HOME_RESOLVE = r; });
  const add = (tag, attrs) => { const e = document.createElement(tag); Object.assign(e, attrs); document.head.appendChild(e); };
  add("link", { rel: "manifest", href: "manifest.webmanifest" });
  add("link", { rel: "apple-touch-icon", href: "icons/180.png" });
  add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
  add("meta", { name: "mobile-web-app-capable", content: "yes" });
  add("meta", { name: "apple-mobile-web-app-title", content: "HOME" });
  add("meta", { name: "theme-color", content: "#1d2124" });
  add("script", { type: "module", src: "fb.js" });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a slim left rail (expands on hover/tap) holds every switch; the desk to its right = overview, urgency board, week columns, done calendar */
:root{
  --bg:#f7f7f5; --surface:#ffffff; --fg:#1d2124; --muted:#6d747a; --line:#e3e4e1;
  --accent:#2f5d8a; --accent-soft:#e6eef6;
  --hot:#c2412d; --hot-soft:#fbe9e5; --warn:#b07a12; --warn-soft:#f8efd9; --hot-ink:#a3301c; --warn-ink:#7f5508; --calm:#7a8288; --calm-soft:#eef0f1;
  --good:#2f7d4f; --good-soft:#e3f1e8; --rail:#eeeeeb; --shade:rgb(0 0 0 / .14); --scrim:rgb(0 0 0 / .28);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --rail-w:60px; --rail-open:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191b; --surface:#1f2225; --fg:#e7e9ea; --muted:#9aa1a7; --line:#30353a;
  --accent:#7fb0e0; --accent-soft:#22313f;
  --hot:#ef8a76; --hot-soft:#3a2420; --warn:#e2b45a; --warn-soft:#352b18; --hot-ink:#ef8a76; --warn-ink:#e2b45a; --calm:#a3abb1; --calm-soft:#272b2f; --good:#6cc391; --good-soft:#1d3226; --rail:#1b1e20;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191b; --surface:#1f2225; --fg:#e7e9ea; --muted:#9aa1a7; --line:#30353a;
  --accent:#7fb0e0; --accent-soft:#22313f;
  --hot:#ef8a76; --hot-soft:#3a2420; --warn:#e2b45a; --warn-soft:#352b18; --hot-ink:#ef8a76; --warn-ink:#e2b45a; --calm:#a3abb1; --calm-soft:#272b2f; --good:#6cc391; --good-soft:#1d3226; --rail:#1b1e20;
  color-scheme:dark}
*{box-sizing:border-box}
h1,h2,h3,h4{text-wrap:balance}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1340px;margin:0 auto;padding-block:20px 60px;padding-left:calc(var(--rail-w) + max(20px,env(safe-area-inset-left,0px)));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:.02em;font-weight:700}
.sub{color:var(--muted);font-size:13px;font-family:var(--f-mono)}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- left rail ---- */
.side{position:fixed;left:0;top:0;bottom:0;z-index:20;width:calc(var(--rail-open) + env(safe-area-inset-left,0px));background:var(--rail);
  padding-left:env(safe-area-inset-left,0px);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  /* the rail is always full width; a clip reveals it, so opening never re-lays-out its contents */
  clip-path:inset(0 calc(var(--rail-open) - var(--rail-w)) 0 0);-webkit-clip-path:inset(0 calc(var(--rail-open) - var(--rail-w)) 0 0);
  transition:clip-path .18s ease,-webkit-clip-path .18s ease,box-shadow .18s ease;overflow:hidden}
.side::after{content:"";position:absolute;top:0;bottom:0;left:calc(var(--rail-w) + env(safe-area-inset-left,0px) - 1px);width:1px;background:var(--line);transition:transform .18s ease;pointer-events:none}
.side.open::after{transform:translateX(calc(var(--rail-open) - var(--rail-w)))}
.side-scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:16px 12px 20px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.side.open{clip-path:inset(0 -32px 0 0);-webkit-clip-path:inset(0 -32px 0 0);box-shadow:4px 0 24px var(--shade)}
@media (hover:hover){.side:hover{clip-path:inset(0 -32px 0 0);-webkit-clip-path:inset(0 -32px 0 0);box-shadow:4px 0 24px var(--shade)}.side:hover::after{transform:translateX(calc(var(--rail-open) - var(--rail-w)))}}
.side .lbl{white-space:nowrap;opacity:0;transition:opacity .12s}
.side.open .lbl{opacity:1}
@media (hover:hover){.side:hover .lbl{opacity:1}}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;font-weight:700;letter-spacing:.04em}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;flex:none}
.grp{font-size:11px;letter-spacing:.08em;color:var(--muted);padding:16px 12px 4px;white-space:nowrap;height:32px}
.navb{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:8px;padding:8px 8px;cursor:pointer;color:var(--muted);text-align:left;font-size:14px;min-height:38px}
.navb svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navb:hover{background:var(--calm-soft);color:var(--fg)}
.navb[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.navb .val{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.navb.sec{font-size:13px;min-height:32px;padding:4px 8px}
.navb.sec svg{width:16px;height:16px;margin:0 2px}
.side hr{border:0;border-top:1px solid var(--line);margin:8px 8px}
.menu-btn{display:none}
@media (max-width:700px){
  :root{--rail-w:0px}
  .side,.side:hover,.side.open{width:min(82vw, calc(var(--rail-open) + env(safe-area-inset-left,0px)));clip-path:none;-webkit-clip-path:none;border-right:1px solid var(--line);transition:transform .2s ease,box-shadow .2s ease}
  .side,.side:hover{transform:translateX(-101%);box-shadow:none}
  .side.open{transform:none}
  .side::after{display:none}
  .menu-btn{display:grid;place-items:center;position:fixed;z-index:21;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
  .menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
  .wrap{padding-top:64px}
  .brand{padding-left:52px}
}
.scrim{position:fixed;inset:0;z-index:19;background:var(--scrim)}

.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:16px}
section.block{margin-bottom:32px;scroll-margin-top:calc(16px + env(safe-area-inset-top,0px))}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.sec-h h2{font-size:17px;margin:0;font-weight:700}
.sec-h .sp{flex:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
/* urgency board */
.board{display:grid;grid-template-columns:repeat(var(--ncol,3),minmax(0,1fr));gap:16px}
@media (min-width:861px){.board[style*="--ncol:4"],.board[style*="--ncol:5"],.board[style*="--ncol:6"]{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.col.custom .dot{background:var(--muted)}
.ctx.cm{position:fixed;z-index:60;min-width:200px;max-width:280px}
#cmenu[hidden],#slash[hidden]{display:none}
.ctx.slash{position:fixed;z-index:70;min-width:220px;max-width:300px;max-height:320px;overflow:auto}
.ctx.slash button{display:flex;align-items:center;gap:8px;width:100%}
.ctx.slash button.on{background:var(--accent-soft)}
.sl-ic{display:inline-flex;justify-content:center;width:22px;height:22px;align-items:center;border:1px solid var(--line);border-radius:5px;font-size:12px;color:var(--muted);flex:0 0 auto}
.sl-chip{flex:0 0 auto;border:0;border-radius:6px;padding:2px 8px;font-size:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer;white-space:nowrap}
.item.blk .t,.item.blk hr{flex:1}
.item.k-h .t{font-weight:700;font-size:15.5px}
.item.k-p .t{color:var(--fg)}
.item.blk .bul{flex:0 0 auto;width:18px;color:var(--muted);font-family:var(--f-mono);font-size:13px;text-align:center}
.item.k-ul .bul{font-size:18px;line-height:1;color:var(--fg)}
.item.k-tg{display:block}
.item.k-tg details>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.item.k-tg details>summary::-webkit-details-marker{display:none}
.item.k-tg .tw{display:inline-block;transition:transform .15s;color:var(--muted);font-size:12px;width:18px;text-align:center}
.item.k-tg details[open] .tw{transform:rotate(90deg)}
.item.k-tg summary .t{flex:1}
.tg-kids{list-style:none;margin:4px 0 2px 24px;padding:0}
.tg-kids li{display:flex;gap:8px;align-items:center;padding:2px 0}.tg-kids li::before{content:"•";width:18px;text-align:center;font-size:16px;line-height:1}.tg-kids li .t{flex:1}
.tg-kids li .icon-btn{opacity:0}.tg-kids li:hover .icon-btn{opacity:1}
.tg-add{margin-left:24px}
.item.k-tb{display:block}
.item.k-tb .tb-h{display:flex;align-items:center;gap:8px;min-height:4px}.item.k-tb .tb-h .t{flex:1}
.tb-wrap{overflow-x:auto;margin:4px 0}
.utb{border-collapse:collapse;font-size:13.5px;min-width:100%}
.utb th,.utb td{border:1px solid var(--line);padding:0;min-width:84px}
.utb th{background:var(--calm-soft);font-weight:600}
.utb .tb-x{border:0;min-width:0;width:24px}.utb .tb-x .icon-btn{opacity:0}.utb tr:hover .tb-x .icon-btn{opacity:1}
.tb-cell{width:100%;border:0;background:transparent;padding:4px 8px;font:inherit;color:var(--fg);font-size:16px}
@media (hover:hover) and (pointer:fine){.tb-cell{font-size:13.5px}}
.utb th .tb-cell{font-weight:600}
.tb-cell:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
.tb-tools{display:flex;gap:8px;opacity:.55}.item.k-tb:hover .tb-tools,.item.k-tb:focus-within .tb-tools{opacity:1}
.item.k-hr hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.ctx.cm .add{display:flex;gap:8px;align-items:center}
.ctx.cm .add input[type=text]{flex:1;min-width:0}
.ctx-sep{height:1px;background:var(--line);margin:8px 0}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px 12px;min-width:0}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.col-h b{font-size:15px}
.col-h .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.urgent .dot{background:var(--hot)} .nagging .dot{background:var(--warn)} .later .dot{background:var(--calm)}
ul.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:8px;padding:4px 2px;border-radius:6px;min-width:0}
.item:hover{background:var(--bg)}
.item[draggable="true"]{cursor:grab}
.item input[type=checkbox]{width:16px;height:16px;margin-top:4px;accent-color:var(--accent);flex:none;cursor:pointer}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item.done .t{color:var(--muted);text-decoration:line-through}
.item .due{font-family:var(--f-mono);font-size:11.5px;padding:1px 8px;border-radius:5px;background:var(--calm-soft);color:var(--muted);white-space:nowrap;margin-top:2px}
.item .due.soon{background:var(--hot-soft);color:var(--hot-ink)}
.item .acts{display:none;gap:2px}
.item:hover .acts,.item:focus-within .acts{display:flex}
@media (hover:none){.item .acts{display:flex}}
/* touch: the bigger buttons drop to their own line when the title would get squeezed */
@media (pointer:coarse){.item{flex-wrap:wrap}.item .t{flex:1 1 150px}.item .acts{margin-left:auto}}
.icon-btn{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:5px;font-size:13px;line-height:1.4}
.icon-btn:hover{background:var(--calm-soft);color:var(--fg)}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 2px;font-size:14px}
.add input:focus{outline:none;border-bottom-color:var(--accent)}
.add input[type=date]{flex:0 0 auto;width:auto;font-size:12px;color:var(--muted)}
.done-toggle{font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer;padding:8px 2px 0}
/* week */
/* five wide day columns; the row scrolls sideways instead of squeezing them */
.week{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(360px,1fr);gap:16px;align-items:start;overflow-x:auto;padding-bottom:12px;overscroll-behavior-x:contain;scrollbar-width:auto;scrollbar-color:var(--muted) var(--calm-soft)}
.week::-webkit-scrollbar{height:10px}
.week::-webkit-scrollbar-track{background:var(--calm-soft);border-radius:5px}
.week::-webkit-scrollbar-thumb{background:var(--muted);border-radius:5px}
@media (max-width:640px){.week{grid-auto-columns:86vw}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:0;display:flex;flex-direction:column;max-height:min(var(--day-max,680px),82vh)}
.day-body{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -8px;padding:0 8px;scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
.day-h,.day-foot{flex:0 0 auto}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day-h{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.day-h b{font-family:var(--f-mono);font-size:15px;font-weight:500}
.day-h span{color:var(--muted);font-size:13px}
.day-h .badge{margin-left:auto;font-size:11px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:9px}
details.proj{margin-top:8px}
details.proj summary{cursor:pointer;font-weight:500;font-size:14px;padding:3px 2px;list-style:none;display:flex;align-items:center;gap:8px}
details.proj summary::-webkit-details-marker{display:none}
details.proj summary::before{content:"▸";color:var(--muted);font-size:11px;transition:transform .12s;display:inline-block}
details.proj[open] summary::before{transform:rotate(90deg)}
details.proj summary .cnt{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
details.proj summary .icon-btn{margin-left:auto}
details.proj .inner{padding-left:16px}
details.proj.virtual summary{color:var(--muted);font-weight:400}
.day-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:8px;border-top:1px dashed var(--line)}
.day-foot select{border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12.5px;padding:3px 8px;color:var(--muted)}
.mini{font-size:12.5px}
.progress{height:4px;border-radius:2px;background:var(--calm-soft);overflow:hidden;margin:2px 0 8px}
.progress i{display:block;height:100%;background:var(--good)}
.carry-tag{font-size:12px;color:var(--warn-ink);background:var(--warn-soft);border-radius:4px;padding:0 4px;margin-top:3px;white-space:nowrap}
.settings-panel{margin-bottom:16px}
.settings-panel .prow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.settings-panel .prow span{flex:1;min-width:0}
.settings-panel label.pin{font-size:13px;color:var(--muted);display:flex;gap:4px;align-items:center}
/* overview strip */
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px 24px;margin-bottom:24px;padding-block:16px;border-block:1px solid var(--line)}
.ov{min-width:0}
.ov .k{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .v{font-family:var(--f-mono);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.3}
.ov .v small{font-size:13px;color:var(--muted)}
.ov .progress{margin:8px 0 0}
.ov.alert .v{color:var(--hot)}
.ov.ok .v{color:var(--good)}
/* done calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .wh{font-size:12px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 8px;min-height:104px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:hover{border-color:var(--muted)}
.cell.out{opacity:.4}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell.sel{background:var(--accent-soft)}
.cell.has{background:linear-gradient(var(--good-soft),var(--good-soft)) top/100% 3px no-repeat, var(--surface)}
.cell.has.sel{background:var(--accent-soft)}
.cell .n{font-family:var(--f-mono);font-size:13px;display:flex;justify-content:space-between;gap:4px}
.cell .n em{font-style:normal;color:var(--good);font-size:11px;font-weight:500}
.cell .ln{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.cell .ln::before{content:"✓ ";color:var(--good)}
.cell .more{font-size:11.5px;color:var(--muted)}
@media (max-width:700px){.cell{min-height:56px;padding:4px 4px}.cell .ln,.cell .more{display:none}}
.cal-detail{margin-top:12px}
.cal-detail .src{font-size:11.5px;color:var(--muted);background:var(--calm-soft);border-radius:5px;padding:0 8px;white-space:nowrap;margin-top:3px}
/* review */
.review-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:960px){.review-grid{grid-template-columns:1fr}}
.inline-edit{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;background:var(--surface);cursor:text;white-space:normal}
tr.bad td{background:var(--hot-soft)}
.warn-i{color:var(--hot-ink);cursor:help}
.chk{margin:0 0 16px;border-color:var(--hot);background:var(--hot-soft)}
.chk .sec-h{margin:0}.chk .list{margin-top:8px}.chk .item{flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;font:inherit;color:var(--fg);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.vol{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.vol h4{margin:0 0 4px;font-size:13.5px}.vol .sub{font-weight:400;font-size:12px}
.vol table{width:100%;border-collapse:collapse;font-size:13px}.vol td{padding:3px 4px;border-top:1px solid var(--line)}
.vol td.num{font-family:var(--f-mono);text-align:right}
li[data-lp]{-webkit-touch-callout:none}

.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 16px;cursor:pointer;font-size:14px}

.chip[draggable]{cursor:grab}.chip.dragging{opacity:.4}

.gcard{padding:12px 16px}
.g-h{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.g-h h3{margin:0;font-size:15px}

.ex{border-bottom:1px solid var(--line)}

.ex-name{font-weight:500;flex:1;min-width:8em}
.ex-target{font-family:var(--f-mono);font-size:12px;color:var(--fg);background:var(--calm-soft);border-radius:5px;padding:1px 8px}
.ex-last{font-family:var(--f-mono);font-size:11.5px;color:var(--good)}
.ex-body{padding:2px 2px 12px 16px;display:flex;flex-direction:column;gap:12px}

.ex-log{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:center}
.ex-log .gl-date{grid-column:1/-1;width:12em}
.eh-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eh-h h4{margin:0}
.sort-btn{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);width:auto}
.ex-hist th{font-weight:500;color:var(--muted);text-align:left;font-size:11.5px;padding:2px 4px}
.ex-hist td .mv{border:0;background:transparent;font:inherit;color:inherit;padding:0;width:8.6em}
.ex-log .lg{font-size:12px;color:var(--muted)}
.ex-log .primary{padding:4px 12px}

.ex-hist table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:12.5px}
.ex-hist td{padding:3px 8px;border-bottom:1px solid var(--line)}
.ex-hist td:last-child{text-align:right;width:2em}

.unote{white-space:pre-wrap;margin:12px 0;color:var(--fg);font-size:14.5px;line-height:1.6}

.unote[contenteditable]:focus{outline-style:solid;background:var(--accent-soft)}
.unote[contenteditable]:empty::before{content:attr(data-ph);color:var(--muted)}
[data-tk][contenteditable]:focus{outline-style:solid;background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}

/* undo: remember what a document looked like before each user action (actions within 0.8 s form one step) */
const undoStack=[]; let undoMute=false, lastUserAt=0, undoGroup=null;
["pointerdown","keydown","change"].forEach(t=>document.addEventListener(t, ()=>{ lastUserAt=performance.now(); }, true));
function cachedDoc(path){ const [c,id]=path.split("/"); if (path==="gym/plan") return S.gymPlan; if (path==="settings/main") return S.settings; const m={tasks:S.tasks,days:S.days,expenses:S.expenses,events:S.events,gymlog:S.gymlog,inbox:S.inbox}[c]; return m?m[id]:undefined; }
function recordUndo(path){
  if (undoMute || performance.now()-lastUserAt>1500) return;
  const a=document.activeElement; if (a && a.tagName==="TEXTAREA") return;
  const now=performance.now(); if (!undoGroup || now-undoGroup.at>800){ undoGroup={at:now, before:new Map()}; undoStack.push(undoGroup); if (undoStack.length>60) undoStack.shift(); }
  if (!undoGroup.before.has(path)){ const cur = pending.has(path) ? pending.get(path) : cachedDoc(path); undoGroup.before.set(path, cur==null ? null : clone(cur)); }
}
function undo(){ const g=undoStack.pop(); undoGroup=null; if (!g){ toast(T("undo_none")); return; }
  undoMute=true; try { for (const [path,before] of g.before){ if (before==null) remove(path); else save(path, before, 50); } } finally { undoMute=false; }
  render(); toast(T("undo_done")); }
document.addEventListener("keydown", e=>{ if ((e.metaKey||e.ctrlKey) && !e.shiftKey && (e.key==="z"||e.key==="Z")){ const a=document.activeElement; if (isTyping() || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type!=="checkbox")) return; e.preventDefault(); undo(); } });
function save(path, body, delay=500){ recordUndo(path); pending.set(path, body); clearTimeout(timers.get(path)); timers.set(path, setTimeout(()=>flush(path), delay)); }
async function flush(path){
  if (inflight.has(path)) { timers.set(path, setTimeout(()=>flush(path), 300)); return; }
  const body = pending.get(path); if (!body || !db) return;
  inflight.add(path);
  try {
    await db.doc(path).set(body);
    if (pending.get(path) === body) { pending.delete(path); setCache(path, body); }
    const el=document.getElementById("savedNote"); if (el) el.textContent = T("saved_at", new Date().toTimeString().slice(0,5));
  } catch(e) {
    if (e && e.code==="quota_exceeded") toast(T("quota"));
    else if (e && e.code==="unavailable") setTimeout(()=>flush(path), 1500+Math.random()*1000);
    else toast(T("save_fail", e && e.message || e));
  } finally { inflight.delete(path); }
}
function setCache(path, body){ const [c,id]=path.split("/"); if (c==="tasks") S.tasks[id]=body; else if (c==="days") S.days[id]=body; else if (c==="expenses") S.expenses[id]=body; else if (c==="events") S.events[id]=body; else if (c==="gymlog") S.gymlog[id]=body; else if (path==="gym/plan") S.gymPlan=body; else if (path==="settings/main") S.settings=body; else if (c==="inbox") S.inbox[id]=body; }
async function remove(path){
  recordUndo(path);
  pending.delete(path); clearTimeout(timers.get(path));
  const [c,id]=path.split("/"); if (c==="tasks") delete S.tasks[id]; if (c==="events") delete S.events[id]; if (c==="inbox") delete S.inbox[id];

}

const DAY_MAX=7, DAY_KEEP=5; // a day card stays until it is 5 days old (11/8 leaves on 11/13), then a new day is added at the end
function dayDefault(){ const t=today(); return [-1,0,1,2,3].map(i=>addDays(t,i)); }
/* the day cards: what was saved, plus one more card at the end for every day that has passed since, keeping at most 7 */
function dayCards(){ const st=settings().dayCards; if(!st || !st.list || !st.list.length) return dayDefault();
  let list=[...new Set(st.list)].sort(); const size=list.length, t=today(), keep=addDays(t,-(DAY_KEEP-1));
  if (list[list.length-1] < t) list=[t]; // long time away: start again from today
  list=list.filter(d=>d>=keep); if (!list.length) list=[t];
  while (list.length<size) list.push(addDays(list[list.length-1],1));
  return list.slice(0,DAY_MAX); }
function saveDayCards(list){ const st=clone(settings()); list=[...new Set(list)].sort(); if(list.length>DAY_MAX) list=list.slice(-DAY_MAX);
  st.dayCards = list.length?{list, at:today()}:null; save("settings/main",st,50); render(); }

          ${bl.filter(b=>b.id!==bk).map(b=>`<button class="icon-btn" data-act="task-move" data-id="${t.id}" data-to="${b.id}" title="${esc(T("move_to",bName(b)))}">${b.name?esc("→"+b.name.slice(0,2)):T("mv_"+b.id)}</button>`).join("")}

/* unfinished items from the past 14 days, shown under today automatically */
/* items from earlier days that were checked off on this date: they stay on this date's card */
// items checked on their own card on 11/11 just before the card-date fix: count them on their own day
function doneDay(it, ds){ return (!it.dc && it.dn==="2026-11-11" && ds<it.dn && ds>="2026-11-10") ? ds : (it.dn||ds); }
function shownOn(it, date){ if (!it.d || it.k) return false; if (it.dc) return it.dc===date; return it.dn===date && it.dn<="2026-11-10"; } // items checked before dc existed keep the old rule
function doneOn(date){ const out=[];
  for (let i=14;i>=1;i--){ const ds=addDays(date,-i); if(!hasDay(ds)) continue; const d=day(ds);
    (d.items||[]).forEach(it=>{ if(shownOn(it,date)) out.push({date:ds, pi:-1, it, proj:null}); });
    (d.projects||[]).forEach((p,pi)=>p.items.forEach(it=>{ if(shownOn(it,date)) out.push({date:ds, pi, it, proj:p.name}); })); }
  return out; }
function carried(withDone){
  const t=today(), out=[];
  for (let i=14;i>=1;i--){ const ds=addDays(t,-i); if(!hasDay(ds)) continue; const d=day(ds);
    (d.items||[]).forEach(it=>{ if(!it.k && (!it.d || (withDone && it.dn===t))) out.push({date:ds, pi:-1, it, proj:null}); });
    (d.projects||[]).forEach((p,pi)=>p.items.forEach(it=>{ if(!it.k && (!it.d || (withDone && it.dn===t))) out.push({date:ds, pi, it, proj:p.name}); })); }
  return out;
}

function overview(tasks){
  const t=today(), ts=dayStats(day(t)), car=carried();
  const wk=Array.from({length:7},(_,i)=>addDays(mondayOf(new Date()),i));
  let wn=0, wk_=0; const per={}; pinned().forEach(p=>per[p]={n:0,k:0});
  wk.forEach(ds=>{ if(!hasDay(ds)) return; const d=day(ds), s=dayStats(d); wn+=s.n; wk_+=s.k; (d.projects||[]).forEach(p=>{ if(!per[p.name]) return; per[p.name].n+=p.items.filter(i=>!i.k).length; per[p.name].k+=p.items.filter(i=>i.d).length; }); });
  const open=tasks.filter(x=>!x.done);
  const overdue=open.filter(x=>x.due && x.due<t).length, soon=open.filter(x=>x.due && x.due>=t && (parse(x.due)-parse(t))/864e5<=3).length;
  const bar=(k,n)=>`<div class="progress"><i style="width:${n?k/n*100:0}%"></i></div>`;
  const tn=ts.n+car.length, tk=ts.k;
  const projStat=name=>{ let n=0,k=0; wk.forEach(ds=>{ if(!hasDay(ds)) return; (day(ds).projects||[]).forEach(p=>{ if(p.name!==name) return; n+=p.items.filter(i=>!i.k).length; k+=p.items.filter(i=>i.d).length; }); }); return {n,k}; };
  const card=id=>{
    if (id==="today") return `<div class="ov ${tn&&tk===tn?"ok":""}" data-card="today"><div class="k">${L("ov_today")}</div><div class="v">${tk}<small>/${tn}</small></div>${bar(tk,tn)}</div>`;
    if (id==="week") return `<div class="ov" data-card="week"><div class="k">${L("ov_week")}</div><div class="v">${wk_}<small>/${wn}</small></div>${bar(wk_,wn)}</div>`;
    if (id==="due") return `<div class="ov ${overdue?"alert":""}" data-card="due"><div class="k">${L("ov_due")}</div><div class="v">${overdue}<small> / ${soon}</small></div></div>`;
    if (id==="carry") return `<div class="ov ${car.length?"alert":""}" data-card="carry"><div class="k">${L("ov_carry")}</div><div class="v">${car.length}<small>${T("unit_items")}</small></div></div>`;
    if (id.startsWith("proj:")){ const nm=id.slice(5), st=per[nm]||projStat(nm); return `<div class="ov" data-card="${esc(id)}"><div class="k">${esc(T("ov_proj",nm))}</div><div class="v">${st.k}<small>/${st.n}</small></div>${bar(st.k,st.n)}</div>`; }
    return ""; };
  const list=ovCards();
  return `<div class="overview" data-row="ov">${list.map(card).join("") || `<p class="empty mini">${T("cm_row_empty")}</p>`}</div>`;
}

/* right-click → edit: the item's text becomes editable in place; Enter or clicking away saves, Esc cancels */
function startInlineEdit(el, ref){

document.addEventListener("pointercancel", e=>{ if (lp && e.pointerId===lp.id && !lp.on) lpEnd(false); });
document.addEventListener("contextmenu", e=>{ if ((lp && lp.on) || performance.now()-(window.__lpBlock||0)<400){ e.preventDefault(); e.stopImmediatePropagation(); } }, true);
document.addEventListener("click", e=>{ if (performance.now()-(window.__lpBlock||0)<300){ e.preventDefault(); e.stopImmediatePropagation(); } }, true);
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && lp) lpEnd(false); });

function moveTo(d, date){
  if (!date) return;
  if (d.k==="ev"){ const e=ev(d.id); if(e) save("events/"+e.id,{...e,date},50); }
  else if (d.k==="due"){ const t=task(d.id); if(t) save("tasks/"+t.id,{...t,due:date},50); }
  else if (d.k==="dt"){ const t=task(d.id); if(t) save("tasks/"+t.id,{...t,doneAt:parse(date).getTime()+12*36e5},50); }
  else if (d.k==="dd"){ const x=dayCopy(d.date), it=listOf(x,+d.pi).find(i=>i.id===d.id); if(it){ it.dn=date; save("days/"+x.date,x,50); } }
  else if (d.k==="gl"){ const from=gymMonth(d.month), e=from.entries.find(x=>x.id===d.id); if(!e) return;
    const a=clone(from); a.entries=a.entries.filter(x=>x.id!==d.id);
    if (date.slice(0,7)===d.month){ a.entries.push({...e,date}); save("gymlog/"+d.month,a,50); }
    else { save("gymlog/"+d.month,a,50); const b=clone(gymMonth(date.slice(0,7))); b.entries.push({...e,date}); save("gymlog/"+date.slice(0,7),b,50); } }
  S.calSel=date; render(); toast(T("moved",md(date)));
}

function gymMonth(m){ return pending.get("gymlog/"+m) || S.gymlog[m] || {month:m, entries:[]}; }
function gymEntries(){ const ks=new Set(Object.keys(S.gymlog)); for (const p of pending.keys()) if (p.startsWith("gymlog/")) ks.add(p.slice(7)); return [...ks].flatMap(k=>gymMonth(k).entries); }

/* training calendar: gym records only, its own month, not tied to the main calendar */
const GHUES=[212,145,28,330,265,180,52,0];
function viewGymCal(rs, all){
  const [y,m]=S.gcalMonth.split("-").map(Number), t=today();
  const cells=[]; let ds=mondayOf(new Date(y,m-1,1));
  do { for (let i=0;i<7;i++){ cells.push(ds); ds=addDays(ds,1); } } while (parse(ds).getMonth()===m-1);
  const exR={}; rs.forEach(r=>r.groups.forEach(g=>g.ex.forEach(x=>exR[x.id]=r.id)));
  const rid=e=>rs.some(r=>r.id===e.routineId)?e.routineId:(exR[e.exId]||"_");
  const hue=id=>{ const i=rs.findIndex(r=>r.id===id); return i<0?null:GHUES[i%GHUES.length]; };
  const rname=id=>rs.find(r=>r.id===id)?.name||T("gcal_other");

  const days=Object.keys(by).filter(d=>d<=t).sort(), lastAny=days[days.length-1];
  const sum=rs.map(r=>{ const ds=Object.keys(by).filter(d=>by[d][r.id]&&d<=t).sort(), last=ds[ds.length-1], n=mine.filter(d=>by[d][r.id]).length;
    return `<div class="gsum" style="--h:${hue(r.id)}"><span class="dot"></span><b>${esc(r.name)}</b><span class="sub">${last?`${T("gcal_last")} ${md(last)} · ${T("gcal_ago",daysBetween(last,t))}`:T("gcal_never")}</span><span class="sub">${T("gcal_times",n)}</span></div>`; }).join("");

      <button class="ghost" data-act="gcalmonth" data-n="-1" aria-label="${T("prev_month")}">←</button><button class="ghost" data-act="gcalmonth" data-n="0">${T("this_month")}</button><button class="ghost" data-act="gcalmonth" data-n="1" aria-label="${T("next_month")}">→</button></div>
    ${rs.length?`<div class="gsums">${sum}</div>`:""}
    <div class="cal gcal">${T("wd_mon_first").map(w=>`<div class="wh">${w}</div>`).join("")}
    ${cells.map(c=>{ const d=by[c]||{}, ks=Object.keys(d), n=ks.reduce((s,k)=>s+d[k].length,0), pg=program(), pr=progPlanned(pg,c), wkN=pg&&c>=pg.start&&c<=progEnd(pg)&&daysBetween(pg.start,c)%7===0?daysBetween(pg.start,c)/7+1:0;
      const plan = pr && !d[pr] ? `<span class="gchip plan ${c<t?"miss":""}" ${hue(pr)==null?"":`style="--h:${hue(pr)}"`} title="${c<t?T("pg_missed"):T("pg_planned")} · ${esc(rname(pr))}">${esc(rname(pr))}</span>` : "";
      return `<div role="button" tabindex="0" class="cell gcell ${pg&&c>=pg.start&&c<=progEnd(pg)?"inprog":""} ${parse(c).getMonth()!==m-1?"out":""} ${c===t?"today":""} ${n?"trained":""} ${c===sel?"sel":""}" data-act="gcal-sel" data-date="${c}" data-drop-date="${c}" aria-label="${c}">
        <span class="n"><span>${parse(c).getDate()}</span>${wkN?`<em class="wk-n">W${wkN}</em>`:""}</span>
        ${ks.slice(0,3).map(k=>chip(k,d[k].length)+(pr===k?"":"")).join("")}${plan}${ks.length>3?`<span class="more">+${ks.length-3}</span>`:""}
      </div>`; }).join("")}
    </div>
    ${sel?`<div class="gday"><div class="pop-h"><b>${md(sel)} ${dow(sel)}</b><span class="sp"></span><button class="icon-btn" data-act="gcal-sel" data-date="${sel}" aria-label="close">✕</button></div>
      ${sd?Object.keys(sd).map(k=>`<h4>${chip(k,sd[k].length)}</h4><table><tbody>${sd[k].map(e=>`<tr><td>${esc(e.exName)}</td><td>${esc(e.sets||"")}</td><td>${esc(e.weight||"")}</td><td>${esc(e.rpe?"RPE "+e.rpe:"")}</td><td>${esc(e.rest||"")}</td><td><input type="date" class="mv" value="${e.date}" data-act="mv-date" data-drag="${esc(JSON.stringify({k:"gl",month:e.date.slice(0,7),id:e.id}))}" aria-label="${T("move_date")}"></td></tr>`).join("")}</tbody></table>`).join(""):`<p class="empty mini">${T("gcal_day_empty")}</p>`}
    </div>`:""}
    <p class="sub" style="margin-top:8px">${L("gcal_sub")}</p>

/* ---------- gym numbers: parse records, check them, volume and e1RM ---------- */
function parseSR(v){ const m=String(v||"").match(/(\d+(?:\.\d+)?)\s*[x×X*＊]\s*(\d+(?:\.\d+)?)/); return m?{sets:+m[1],reps:+m[2]}:null; }
function parseW(v){ const s=String(v||"").trim(); if (!s) return null; if (/自重|bw|body\s*weight/i.test(s)) return {kg:0, bw:true, unit:"kg"};
  const m=s.match(/(\d+(?:\.\d+)?)\s*(kg|公斤|lbs?|磅)?/i); if (!m) return {bad:true}; const num=+m[1], u=(m[2]||"").toLowerCase();
  return /lb|磅/.test(u) ? {kg:num*0.4536, unit:"lb", raw:num} : {kg:num, unit:u?"kg":"", raw:num}; }
function parseRpe(v){ const s=String(v||"").trim(); if (!s) return null; const m=s.match(/(\d+(?:\.\d+)?)\s*$/); return m?+m[1]:NaN; }
function parseRest(v){ const s=String(v||"").trim().toLowerCase(); if (!s) return null;
  let m=s.match(/^(\d+)\s*[:：]\s*(\d{1,2})$/); if (m) return +m[1]*60+ +m[2];
  m=s.match(/^(\d+(?:\.\d+)?)\s*(s|sec|秒)?$/); if (m) return +m[1]*(+m[1]<=10 && !m[2] ? 60 : 1);
  m=s.match(/^(\d+(?:\.\d+)?)\s*(m|min|分鐘?)\s*(?:(\d+)\s*(s|sec|秒)?)?$/); if (m) return +m[1]*60+(+m[3]||0);
  return NaN; }
function fmtRest(sec){ return sec==null||isNaN(sec) ? "" : sec>=60 ? `${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,"0")}` : `${Math.round(sec)}s`; }
function isStrength(e){ return !!parseSR(e.sets) || !!String(e.weight||"").trim(); }
function entryVol(e){ const sr=parseSR(e.sets), w=parseW(e.weight); return sr && w && !w.bad ? sr.sets*sr.reps*w.kg : 0; }
function entryE1rm(e){ const sr=parseSR(e.sets), w=parseW(e.weight); if (!sr || !w || w.bad || !w.kg) return 0; const r=parseRpe(e.rpe), rir=isNaN(r)||r==null?0:Math.max(0,Math.min(5,10-r)); return w.kg*(1+(sr.reps+rir)/30); }
function entryIssues(e, prev){
  if (!isStrength(e)) return [];
  const out=[], sr=parseSR(e.sets), w=parseW(e.weight), r=parseRpe(e.rpe), rest=parseRest(e.rest);
  if (!sr) out.push(T("chk_sets"));
  else { if (!sr.sets || !sr.reps) out.push(T("chk_zero")); if (sr.sets>12) out.push(T("chk_sets_big",sr.sets)); if (sr.reps>50) out.push(T("chk_reps_big",sr.reps)); }
  if (!w) out.push(T("chk_no_w"));
  else if (w.bad) out.push(T("chk_no_w"));
  else if (!w.bw){ if (!w.kg) out.push(T("chk_w_zero")); else if (w.kg>400) out.push(T("chk_w_big",Math.round(w.kg))); else if (!w.unit) out.push(T("chk_unit"));
    const pw=prev && parseW(prev.weight); if (pw && !pw.bad && pw.kg && w.kg && (w.kg/pw.kg>2.5 || w.kg/pw.kg<0.4)) out.push(T("chk_jump",prev.weight,e.weight)); }
  if (r!=null && (isNaN(r) || r<1 || r>10)) out.push(T("chk_rpe"));
  if (rest!=null){ if (isNaN(rest)) out.push(T("chk_rest")); else if (rest>900) out.push(T("chk_rest_big")); }
  return out; }
/* issues for every record, keyed by entry id (compares each record with the one before it for the same exercise) */
function gymIssues(all){ const by={}, res={}; [...all].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0)).forEach(e=>{ const prev=by[e.exId]; const is=entryIssues(e, prev); if (is.length) res[e.id]=is; if (isStrength(e)) by[e.exId]=e; }); return res; }
function kgFmt(v){ return v>=1000 ? (v/1000).toFixed(v>=10000?0:1)+"k" : String(Math.round(v)); }

/* ---------- 10-week program ---------- */
function program(){ return gymPlan().program || null; }
function progDefault(rs){ const find=k=>rs.find(r=>r.name.toLowerCase().includes(k))?.id||""; const push=find("push"), pull=find("pull"), leg=find("leg");
  let st=today(); while (parse(st).getDay()!==2) st=addDays(st,1);
  return {start:st, weeks:10, days:{"2":push,"3":pull,"5":leg,"6":push,"0":pull}}; }
function progEnd(pg){ return addDays(pg.start, pg.weeks*7-1); }
function progPlanned(pg, ds){ if (!pg || ds<pg.start || ds>progEnd(pg)) return null; return pg.days[String(parse(ds).getDay())]||null; }
function viewProgram(rs, all){
  const pg=program(), t=today(), ed=S.pgEdit;
  if (ed){ const days=[1,2,3,4,5,6,0];

function viewCompare(rs, all, pg){
  const t=today(), end=progEnd(pg), upto=t<end?t:end;

    ${groups.length?`<h4>${T("cmp_wk")}</h4><div class="wkvol">${groups.map(g=>`<div class="wv"><span class="wv-n">${esc(g.name)}</span><div class="wv-bars">${g.v.map((v,i)=>`<i style="height:${v/mx*100}%" title="W${i+1} · ${Math.round(v)} kg"></i>`).join("")}</div></div>`).join("")}</div>`:""}

    for (const k of Object.keys(S.gymlog)){ const m=gymMonth(k); if (m.entries.some(e=>/[\/／]/.test(String(e.rpe||"")))){ const c=clone(m); c.entries.forEach(e=>{ if (/[\/／]/.test(String(e.rpe||""))) e.rpe=String(e.rpe).split(/[\/／]/).pop().trim(); }); save("gymlog/"+k,c,200); } }

    else if (pl.routines && pl.routines.length && !pl.fix3){

      for (const k of Object.keys(S.gymlog)){ const m=gymMonth(k); if (m.entries.some(iso)){ const c=clone(m); c.entries.forEach(e=>{ if (iso(e)) e.rest=REST_DEFAULT; }); save("gymlog/"+k,c,200); } }
      save("gym/plan",{...clone(pl), fix4:true},200); }
    if (pl.routines && pl.routines.length && !pl.fix1){

      c.fix1=true; c.fix2=true; c.fix3=true; c.fix4=true; save("gym/plan",c,200);
      const oct=clone(pending.get("gymlog/2026-10")||gymMonth("2026-10")); let add=false;
      [{id:"ne7",date:"2026-10-20",routineId:"push",exId:"e7",exName:"Sitting DB lateral raises",sets:"3×12",weight:"60 lbs",rpe:"10",rest:REST_DEFAULT,ts:1793974319475},
       {id:"ne8",date:"2026-10-20",routineId:"push",exId:"e8",exName:"Sitting machine lateral raise",sets:"3×10",weight:"110 lbs",rpe:"9",rest:REST_DEFAULT,ts:1793974319476}].forEach(e=>{ if (!gymEntries().some(x=>x.id===e.id || (x.exId===e.exId && x.date===e.date))){ oct.entries.push(e); add=true; } });
      if (add){ oct.month="2026-10"; save("gymlog/2026-10",oct,200); } }
    // 2026-11-11: Adam restarted the 10-week program from Sat 11/14
    { const p2=pending.get("gym/plan")||gymPlan(); if (p2.program && p2.program.start==="2026-11-10" && !p2.fix5) save("gym/plan",{...clone(p2), program:{...p2.program, start:"2026-11-14"}, fix5:true},200); }
    // 2026-11-11: new cycle. Old records are backed up to gym/backup-20261111, then replaced by one starting record per exercise
    // (its latest record, 5 lb / 2.5 kg lighter), dated 11/13, the day before the program starts.
    { const p3=pending.get("gym/plan")||gymPlan(); if (p3.routines && p3.routines.length && !p3.fix6){
      const ks=[...new Set([...Object.keys(S.gymlog), ...[...pending.keys()].filter(k=>k.startsWith("gymlog/")).map(k=>k.slice(7))])], months={};
      ks.forEach(k=>{ months[k]=clone(gymMonth(k).entries||[]); });
      const all=Object.values(months).flat();
      if (all.length){
        save("gym/backup-20261111",{at:Date.now(), note:"records before the 11/14 cycle", months},200);
        const lighter=w=>{ const q=parseW(w); if (!q || q.bad || q.bw || q.raw==null) return w; const nv=Math.round((q.raw-(q.unit==="lb"?5:2.5))*100)/100; return nv>0 ? String(w).replace(/\d+(?:\.\d+)?/, String(nv)) : w; };
        const latest={}; all.forEach(e=>{ const c=latest[e.exId]; if (!c || e.date>c.date || (e.date===c.date && (e.ts||0)>(c.ts||0))) latest[e.exId]=e; });

        ks.forEach(k=>{ if (k!=="2026-11") remove("gymlog/"+k); });
        save("gymlog/2026-11",{month:"2026-11", entries:fresh},200);
      }
      save("gym/plan",{...clone(p3), fix6:true},200); } }
  } finally { undoMute=false; } }

/* ---------- subscriptions (settings.subs) ---------- */
const SUB_RATE={TWD:1, USD:32, JPY:0.21, EUR:35};
function subs(){ return settings().subs||[]; }
function addMonthsKeep(ds, n, dom){ const [y,m]=ds.split("-").map(Number); const t=new Date(y, m-1+n, 1); const last=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate(); return ymd(new Date(t.getFullYear(), t.getMonth(), Math.min(dom,last))); }
function subNext(sb){ const t=today(), st=sb.start||t, dom=+st.slice(8,10); let d=st;
  for (let k=1; d<t && k<2000; k++) d = sb.cycle==="week" ? addDays(st,7*k) : addMonthsKeep(st, sb.cycle==="year"?12*k:k, dom);
  return d; }
function subMonthly(sb){ const v=(+sb.amount||0)*(SUB_RATE[sb.cur||"TWD"]||1); return sb.cycle==="year"? v/12 : sb.cycle==="week" ? v*52/12 : v; }
function viewSubs(){
  const list=subs().map(sb=>({sb, next:subNext(sb)})).sort((a,b)=>(a.sb.paused?1:0)-(b.sb.paused?1:0) || (a.next<b.next?-1:1));
  const act=list.filter(x=>!x.sb.paused), mo=act.reduce((s,x)=>s+subMonthly(x.sb),0), t=today();
  const ed=S.subEdit && subs().find(x=>x.id===S.subEdit), cyc=c=>T("sub_"+(c||"month"));
  const amt=sb=>`${(sb.cur&&sb.cur!=="TWD")?sb.cur+" ":"$"}${(+sb.amount||0).toLocaleString("zh-TW")}`;
  const f=ed||{cycle:"month", cur:"TWD", start:t};
  return `<section class="block card subs" id="s-subs">
    <div class="sec-h"><h2>${L("sub_title")}</h2>${act.length?`<span class="sub">${T("sub_sum", money(mo), money(mo*12), act.length)}</span>`:""}</div>
    ${list.length?`<ul class="sub-list">${list.map(({sb,next})=>{ const n=daysBetween(t,next);
      return `<li class="sub-row ${sb.paused?"paused":""} ${!sb.paused&&n<=3?"soon":""}">
        <span class="sb-name">${esc(sb.name)}${sb.note?`<span class="sb-note">${esc(sb.note)}</span>`:""}</span>
        <span class="sb-amt">${amt(sb)}<small> / ${cyc(sb.cycle)}</small></span>
        <span class="sb-next">${sb.paused?T("sub_paused"):`${md(next)} ${dow(next)}<small>${T("sub_in",n)}</small>`}</span>
        <span class="sb-acts">${sb.paused?"":`<button class="ghost mini" data-act="sub-log" data-id="${sb.id}">${T("sub_log")}</button>`}<button class="ghost mini" data-act="sub-pause" data-id="${sb.id}">${sb.paused?T("sub_resume"):T("sub_pause")}</button><button class="ghost mini" data-act="sub-edit" data-id="${sb.id}">${T("sub_edit")}</button><button class="icon-btn" data-act="sub-del" data-id="${sb.id}" title="${T("del")}">${S.confirmDel==="sub:"+sb.id?T("confirm_del"):"✕"}</button></span>
      </li>`; }).join("")}</ul>`:`<p class="empty">${T("sub_empty")}</p>`}
    <form class="exp sub-form" data-act="sub-save">
      <label>${L("sub_name")}<input name="name" type="text" value="${esc(f.name||"")}" placeholder="${T("sub_name_ph")}" autocomplete="off" required></label>
      <label>${L("sub_amt")}<input name="amount" type="number" inputmode="decimal" min="0" step="any" value="${esc(f.amount??"")}" placeholder="0" required></label>
      <label>${L("sub_cur")}<select name="cur">${Object.keys(SUB_RATE).map(c=>`<option ${c===(f.cur||"TWD")?"selected":""}>${c}</option>`).join("")}</select></label>
      <label>${L("sub_cycle")}<select name="cycle">${["month","year","week"].map(c=>`<option value="${c}" ${c===f.cycle?"selected":""}>${cyc(c)}</option>`).join("")}</select></label>
      <label>${L("sub_next")}<input name="start" type="date" value="${ed?subNext(ed):f.start}"></label>
      <label>${L("sub_note")}<input name="note" type="text" value="${esc(f.note||"")}" placeholder="${T("sub_note_ph")}" autocomplete="off"></label>
      <div class="full sub-btns">${ed?`<button type="button" class="ghost" data-act="sub-cancel">${T("sub_cancel")}</button>`:""}<button class="primary" type="submit">${ed?T("sub_save"):T("sub_add")}</button></div>
    </form>
    ${list.some(x=>x.sb.cur&&x.sb.cur!=="TWD")?`<p class="sub" style="margin-top:8px">${T("sub_rate")}</p>`:""}
  </section>`;
}
function saveSubs(fn){ const st=clone(settings()); st.subs=fn([...(st.subs||[])]); save("settings/main",st,50); render(); }

/* ---------- mutations ---------- */
function dayCopy(date){ const d=clone(day(date)); d.date=date; d.items=d.items||[]; d.projects=d.projects||[]; d.review=d.review||{}; return d; }
function listOf(d,pi){ return pi<0 ? d.items : d.projects[pi].items; }
function setTab(t){ S.tab=t; lsSet("home.tab",t); render._scrolled=false; setSide(false); render(); window.scrollTo({top:0}); }

  slEl.querySelector("button.on")?.scrollIntoView({block:"nearest"}); }
function slashCheck(inp){
  const f=inp.form; if (!f || !["it-add","task-add"].includes(f.dataset.act) || inp.type!=="text") { if (SL.inp) slashClose(); return; }
  const v=inp.value.slice(0, inp.selectionStart ?? inp.value.length), m=v.match(/(^|\s)[\/／]([^\s\/／]*)$/);
  if (!m){ if (SL.inp) slashClose(); return; }
  const q=m[2].toLowerCase(), all=slashCmds(f);
  SL.inp=inp; SL.at=v.length-m[2].length-1; SL.list=all.filter(c=>!q || c.kw.includes(q)); SL.i=Math.min(SL.i, Math.max(0,SL.list.length-1)); if (SL.list.length===0 && q.length>12) return slashClose();
  slashRender(); }
function slashPick(i){ const c=SL.list[i], inp=SL.inp; if(!c||!inp) return; const f=inp.form, end=inp.selectionStart ?? inp.value.length;
  inp.value=(inp.value.slice(0,SL.at)+inp.value.slice(end)).replace(/\s+$/,m=>m); slashClose(); c.run(f,inp); if (document.body.contains(inp)) inp.focus(); }
document.addEventListener("input", e=>{ const t=e.target; if (t.tagName==="INPUT"){ if (!e.isComposing) { if (!SL.inp) SL.i=0; slashCheck(t); } } });
document.addEventListener("compositionend", e=>{ if (e.target.tagName==="INPUT") slashCheck(e.target); });
document.addEventListener("keydown", e=>{ if (!SL.inp || e.target!==SL.inp || e.isComposing) return;
  if (e.key==="ArrowDown"){ e.preventDefault(); SL.i=(SL.i+1)%Math.max(1,SL.list.length); slashRender(); }
  else if (e.key==="ArrowUp"){ e.preventDefault(); SL.i=(SL.i-1+SL.list.length)%Math.max(1,SL.list.length); slashRender(); }
  else if ((e.key==="Enter"||e.key==="Tab") && SL.list.length){ e.preventDefault(); e.stopImmediatePropagation(); slashPick(SL.i); }
  else if (e.key==="Escape"){ e.preventDefault(); slashClose(); } }, true);
slEl.addEventListener("pointerdown", e=>{ e.preventDefault(); const b=e.target.closest("[data-sl]"); if (b) slashPick(+b.dataset.sl); });
document.addEventListener("focusout", e=>{ if (SL.inp && e.target===SL.inp) setTimeout(()=>{ if (document.activeElement!==SL.inp) slashClose(); },0); });
/* right-click menu for the cards on HOME: delete a card, or add one in that row */
const cmEl=document.createElement("div"); cmEl.id="cmenu"; cmEl.className="ctx cm"; cmEl.hidden=true; cmEl.setAttribute("role","menu"); document.body.appendChild(cmEl);
function renderCm(){ const c=S.cm; if(!c){ cmEl.hidden=true; cmEl.innerHTML=""; return; }
  const btn=(act,label,data="")=>`<button role="menuitem" data-act="${act}" ${data}>${label}</button>`;
  let h="";
  if (c.row==="ov"){ if (c.id) h+=btn("cm-ov-del",`✕ ${T("cm_del_card")}`,`data-id="${esc(c.id)}"`);
    const shown=new Set(ovCards()), miss=ovAll().filter(x=>!shown.has(x));
    h+=`<div class="ctx-h">${T("cm_add_card")}</div>` + (miss.length?miss.map(x=>btn("cm-ov-add","＋ "+esc(ovLabel(x)),`data-id="${esc(x)}"`)).join(""):`<p class="empty mini">${T("cm_all_shown")}</p>`);
    if (settings().ovCards) h+=btn("cm-ov-reset",T("cm_reset")); }
  else if (c.row==="col"){
    if (c.task){ const tk=task(c.task); if (tk) h+=btn("cm-edit",`✎ ${T("cm_edit_item", esc(tk.title))}`,`data-task="${tk.id}"`); }
    if (c.task){ const tk=task(c.task); if (tk) h+=btn("task-del",`✕ ${T("cm_del_item", esc(tk.title))}`,`data-id="${tk.id}"`); }
    if (c.id) h+=`<div class="ctx-h">${T("cm_add_item")}</div><form class="add" data-act="task-add" data-bucket="${esc(c.id)}"><input type="text" id="cm-task" placeholder="${T("add_enter")}" autocomplete="off"><input type="date" id="cm-task-due" title="${T("due_title")}"></form><div class="ctx-sep"></div>`;
    if (c.id){ const b=bucketList().find(x=>x.id===c.id); h+=btn("cm-col-del",`✕ ${T("cm_del_col", b?bName(b):"")}`,`data-id="${esc(c.id)}"`); }
    h+=`<div class="ctx-h">${T("cm_add_col")}</div><form class="add" data-act="cm-col-add"><input type="text" id="cm-col-name" placeholder="${T("cm_col_ph")}" autocomplete="off"></form>`; }
  else if (c.row==="day"){ const list=dayCards(), nx=addDays(list[list.length-1],1);
    if (c.id){ const it=c.item, sec=c.sec;
      if (it && c.title) h+=btn("cm-edit",`✎ ${T("cm_edit_item", esc(c.title))}`,`data-date="${it.date}" data-pi="${it.pi}" data-id="${it.id}"`);
      if (it) h+=btn("it-del",`✕ ${T("cm_del_item", esc(c.title))}`,`data-date="${it.date}" data-pi="${it.pi}" data-id="${it.id}"`);
      if (sec && !it) h+= sec.pi!=null ? btn("proj-del",`✕ ${T("cm_del_sec", esc(sec.name))}`,`data-date="${c.id}" data-pi="${sec.pi}"`)
                                       : (pinned().includes(sec.name)?btn("cm-unpin",`✕ ${T("cm_unpin", esc(sec.name))}`,`data-name="${esc(sec.name)}"`):"");
      h+=`<div class="ctx-h">${sec?T("cm_add_item_to", esc(sec.name)):T("cm_add_item")}</div><form class="add" data-act="it-add" data-date="${c.id}" ${sec?`data-proj="${esc(sec.name)}"`:""}><input type="text" id="cm-it" placeholder="${T("todo_ph")}" autocomplete="off"></form>`;
      const d=day(c.id), have=new Set((d.projects||[]).map(p=>p.name)); if (c.id>=today()) pinned().forEach(n=>have.add(n));
      const opts=settings().projects.filter(p=>!have.has(p));
      if (opts.length) h+=`<div class="ctx-h">${T("cm_add_sec")}</div>`+opts.map(p=>btn("cm-sec-add","＋ "+esc(p),`data-date="${c.id}" data-name="${esc(p)}"`)).join("");
      h+=`<div class="ctx-sep"></div>`; }
    if (c.id) h+=btn("cm-day-del",`✕ ${T("cm_del_day", md(c.id))}`,`data-date="${c.id}"`)+(c.id===list[0]?`<p class="empty mini">${T("cm_day_first", md(nx))}</p>`:"");
    h+=`<div class="ctx-h">${T("cm_add_day")}</div>`+btn("cm-day-add",`＋ ${md(nx)} ${dow(nx)}`,`data-date="${nx}"`)+`<form class="add" data-act="cm-day-pick"><input type="date" id="cm-day-date" aria-label="${T("cm_pick_day")}"><button class="ghost mini" type="submit">${T("cm_add")}</button></form>`
      + (list.length>=DAY_MAX?`<p class="empty mini">${T("cm_day_max")}</p>`:""); }
  else if (c.row==="txt"){
    if (c.tk) h+=btn("tx-hide", T("tx_del", esc(c.title)), `data-key="${esc(c.tk)}"`);
    else if (c.note) h+=btn("tx-note-del", T("tx_del", esc(c.title)), `data-id="${esc(c.note)}"`);
    else { h+=btn("tx-add", T("tx_add"));
      const hid=Object.keys(settings().hideTk||{}); if (hid.length) h+=`<div class="ctx-h">${T("tx_restore")}</div>`+hid.map(k=>btn("tx-unhide","↺ "+esc(T(k)),`data-key="${esc(k)}"`)).join(""); } }
  cmEl.innerHTML=h; cmEl.hidden=false;
  const w=cmEl.offsetWidth, hh=cmEl.offsetHeight; cmEl.style.left=Math.max(8,Math.min(c.x, innerWidth-w-8))+"px"; cmEl.style.top=Math.max(8,Math.min(c.y, innerHeight-hh-8))+"px";
}
/* free text boxes: settings.notes [{id, tab, at, text}], placed after the page block "at" */
function blockKey(v, el){ const kids=[...v.children]; const i=kids.indexOf(el); return el.id ? "#"+el.id : "i"+i; }
function injectNotes(v){
  const ns=(settings().notes||[]).filter(n=>n.tab===S.tab); if (!ns.length) return;
  const kids=[...v.children];
  ns.forEach(n=>{ const p=document.createElement("p"); p.className="unote"; p.dataset.note=n.id; p.textContent=n.text||"";
    if (S.edit){ p.contentEditable="plaintext-only"; p.spellcheck=false; p.dataset.ph=T("tx_ph"); }
    let at=null; if (n.at && n.at[0]==="#") at=kids.find(k=>k.id===n.at.slice(1)); else if (n.at) at=kids[+n.at.slice(1)];
    // keep notes after earlier notes placed at the same block
    if (at){ let ref=at; while (ref.nextSibling && ref.nextSibling.classList && ref.nextSibling.classList.contains("unote")) ref=ref.nextSibling; ref.after(p); }
    else if (n.at==="top") v.prepend(p); else v.appendChild(p); });
}
document.addEventListener("focusout", e=>{ const el=e.target; if (!el.classList || !el.classList.contains("unote") || !el.isContentEditable) return;
  const id=el.dataset.note, v=el.innerText.replace(/\n+$/,""); const st=clone(settings()); const n=(st.notes||[]).find(x=>x.id===id); if (!n) return;
  if (!v.trim()){ st.notes=st.notes.filter(x=>x.id!==id); save("settings/main",st,50); setTimeout(()=>{ if(!isTyping()) render(); },0); return; }
  if (n.text===v) return; n.text=v; save("settings/main",st,50); toast(T("edit_saved")); }, true);
/* edit mode: right-click a text box to delete it, empty space to add one */
document.addEventListener("contextmenu", e=>{
  const t=e.target; if (!S.edit || !t.closest || t.closest("#cmenu")) return;
  const v=document.getElementById("view"), hero=t.closest("#heroTitle,.hero,header");
  const tk=t.closest("[data-tk]"), note=t.closest(".unote");
  let c=null;
  if (tk && !(settings().hideTk||{})[tk.dataset.tk]) c={tk:tk.dataset.tk, title:(tk.textContent||"").slice(0,24)};
  else if (note) c={note:note.dataset.note, title:(note.textContent||T("tx_note")).slice(0,24)};
  else if (v.contains(t) && !t.closest("input,textarea,select,button,a,li,img,summary,.cell,.chip,[data-drag],[contenteditable],table")){
    let el=t; while (el && el.parentElement!==v) el=el.parentElement;
    c={at: el ? blockKey(v, el.classList.contains("unote")?(el.previousElementSibling||el):el) : "end"}; }
  else if (hero && !t.closest("input,button,a")) c={at:"top"};
  else if (t===document.body || t===document.documentElement || t===v.parentElement) c={at:"end"};
  if (!c) return; e.preventDefault(); e.stopPropagation(); S.ctx=null; S.cm={row:"txt", x:e.clientX, y:e.clientY, sy:scrollY, ...c}; renderCm(); }, true);
document.addEventListener("contextmenu", e=>{
  const t=e.target; if (!t.closest || S.tab!=="home" || S.edit) return;
  if (t.closest("#s-cal") || t.closest("#cmenu") || t.closest("input,textarea,select,[contenteditable]")) return;
  let row=null, id=null;
  const ov=t.closest(".ov[data-card]"), col=t.closest(".col[data-bucket]"), dy=t.closest(".day[data-day]");
  let extra={};
  if (ov){ row="ov"; id=ov.dataset.card; } else if (t.closest("#s-overview")) row="ov";
  else if (col){ row="col"; id=col.dataset.bucket; const li=t.closest("li[data-task]"); if (li) extra={task:li.dataset.task}; } else if (t.closest("#s-tasks")) row="col";
  else if (dy){ row="day"; id=dy.dataset.day;
    const li=t.closest("li.item"), del=li&&li.querySelector('[data-act="it-del"]'), sec=t.closest("details.proj");
    if (del) extra={item:{...del.dataset}, title:li.querySelector(".t")?.textContent||""};
    if (sec){ const nm=sec.querySelector("summary")?.dataset.name; extra.sec={name:nm, pi:sec.dataset.pi??null}; } }
  else if (t.closest("#s-week")) row="day";
  if (!row) return; e.preventDefault(); S.cm={row,id,x:e.clientX,y:e.clientY,sy:scrollY,...extra}; renderCm(); });
cmEl.addEventListener("click", e=>{ const b=e.target.closest("button[data-act]"); if (b && !b.closest("form")) setTimeout(()=>{ S.cm=null; renderCm(); },0); });
cmEl.addEventListener("submit", ()=>setTimeout(()=>{ S.cm=null; renderCm(); },0));
document.addEventListener("pointerdown", e=>{ if (S.cm && !e.target.closest("#cmenu")){ S.cm=null; renderCm(); } });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && S.cm){ S.cm=null; renderCm(); } });
addEventListener("scroll", ()=>{ if (S.cm && Math.abs(scrollY-(S.cm.sy??scrollY))>60){ S.cm=null; renderCm(); } }, {passive:true});
/* drag routine chips to reorder */
let rtDrag=null;
const rtSide=(c,e)=>{ const b=c.getBoundingClientRect(); return e.clientX<b.left+b.width/2?"l":"r"; };
const rtClear=()=>document.querySelectorAll(".chip.ins-l,.chip.ins-r,.chip.dragging").forEach(x=>x.classList.remove("ins-l","ins-r","dragging"));
document.addEventListener("dragstart", e=>{ const c=e.target.closest&&e.target.closest("[data-rt]"); if(!c) return; rtDrag=c.dataset.rt; c.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",rtDrag);}catch(_){} });
document.addEventListener("dragover", e=>{ const c=rtDrag && e.target.closest && e.target.closest("[data-rt]"); if(!c) return; e.preventDefault(); document.querySelectorAll(".chip.ins-l,.chip.ins-r").forEach(x=>x.classList.remove("ins-l","ins-r")); if(c.dataset.rt!==rtDrag) c.classList.add("ins-"+rtSide(c,e)); });
document.addEventListener("drop", e=>{ const c=rtDrag && e.target.closest && e.target.closest("[data-rt]"); if(!c) return; e.preventDefault();
  const from=rtDrag, to=c.dataset.rt, side=rtSide(c,e); rtDrag=null; rtClear(); if(from===to) return;
  const pl=clone(gymPlan()), rs=pl.routines, i=rs.findIndex(r=>r.id===from); if(i<0) return; const [m]=rs.splice(i,1);
  let j=rs.findIndex(r=>r.id===to); if(j<0) return; if(side==="r") j++; rs.splice(j,0,m); savePlan(pl); render(); });
document.addEventListener("dragend", ()=>{ rtDrag=null; rtClear(); });
document.addEventListener("dragstart", e=>{ const li=e.target.closest&&e.target.closest("[data-task]"); if(!li) return; dragId=li.dataset.task; e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId);}catch(_){} });
document.addEventListener("dragover", e=>{ const c=e.target.closest&&e.target.closest(".col"); if(!c||!dragId) return; e.preventDefault(); document.querySelectorAll(".col.drop").forEach(x=>x!==c&&x.classList.remove("drop")); c.classList.add("drop"); });
document.addEventListener("dragleave", e=>{ const c=e.target.closest&&e.target.closest(".col"); if(c && !c.contains(e.relatedTarget)) c.classList.remove("drop"); });
document.addEventListener("drop", e=>{ const c=e.target.closest&&e.target.closest(".col"); if(!c||!dragId) return; e.preventDefault(); const t=task(dragId); if(t && t.bucket!==c.dataset.bucket) save("tasks/"+t.id,{...t,bucket:c.dataset.bucket},50); dragId=null; render(); });
document.addEventListener("dragend", ()=>{ dragId=null; document.querySelectorAll(".col.drop").forEach(x=>x.classList.remove("drop")); });

/* ---------- boot ---------- */
PHONE.addEventListener?.("change", ()=>render());
render();
function banner(msg){ const b=document.getElementById("banner"); b.textContent=msg; b.hidden=!msg; }
(async () => {
  if (window.HOME_READY){ await window.HOME_READY; render(); }
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e){ db=null; }
  if (!db){ banner(T("offline")); return; }
  for (const p of pending.keys()) flush(p);
  const waiting=new Set(["tasks","days","expenses","settings","events","gymlog","gym","inbox"]);
  const timer=setTimeout(()=>{ if (waiting.size) banner(T("loading")); }, 10000);
  const done=(k,snap)=>{ if (!snap.metadata.fromCache){ waiting.delete(k); if (!waiting.size){ clearTimeout(timer); banner(""); migrateGym(); } } };
  const fail=k=>e=>{ waiting.delete(k); if (e.code!=="revoked") banner(T("disconnected",e.code)); };
  const sub=(name)=>db.collection(name).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S[name]=o; done(name,snap); softRender(); }, fail(name));
  sub("tasks"); sub("days"); sub("expenses"); sub("events"); sub("gymlog"); sub("inbox");
  db.doc("gym/plan").onSnapshot(s=>{ S.gymPlan=s.exists?s.data():null; done("gym",s); softRender(); }, fail("gym"));
  db.doc("settings/main").onSnapshot(s=>{ S.settings=s.exists?s.data():null; S.settingsSeen=true; done("settings",s); softRender(); }, fail("settings"));
})();
})();
</script>
